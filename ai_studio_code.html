<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABO HANY CAPTAIN</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ABO HANY">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0F3D6E">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#F3F6FB;
  --card:#FFFFFF;
  --tx:#0F172A;
  --mu:#64748B;
  --bd:#E2E8F0;
  --pr:#0F3D6E;
  --pr2:#1D63B8;
  --soft:#EEF4FB;
  --ok:#059669;
  --okbg:#ECFDF5;
  --rd:#DC2626;
  --rdbg:#FEF2F2;
  --wa:#16A34A;
  --sh:0 6px 24px rgba(15,23,42,.06);
  color-scheme:light;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,a,.row,.sc,.f{touch-action:manipulation}
button{cursor:pointer;font-weight:700;border:0;font-family:inherit}
input{font-family:inherit}

.wrap{max-width:600px;margin:0 auto;padding:14px 16px 120px}

/* Header */
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.1);flex:none}
.brand-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand-t b{font-size:16px;color:var(--pr);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--okbg);color:var(--ok);font-weight:700;width:fit-content}
.sync.off{background:#FEF3C7;color:#B45309}
.sync.err{background:var(--rdbg);color:var(--rd)}
.hacts{display:flex;gap:6px;flex:none}
.ibtn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:9px 11px;font-size:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.ibtn:active{transform:scale(.96)}

/* Hero Total Card */
.hero{background:linear-gradient(135deg,#0F3D6E 0%,#1B5AA0 100%);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 12px 28px rgba(15,61,110,.22);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:rgba(255,255,255,.85);font-weight:700}
.hero .eybtn{background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:6px 10px;font-size:15px}
.hero .eybtn:active{background:rgba(255,255,255,.26)}
.hero .val{font-size:40px;font-weight:800;line-height:1.2;margin:8px 0 6px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.hero .val small{font-size:16px;font-weight:600;opacity:.85;margin-right:6px}
.hero .meta{font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;display:flex;justify-content:space-between;align-items:center}

/* Category Grid */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 13px;box-shadow:0 2px 8px rgba(15,23,42,.03);cursor:pointer;transition:border-color .15s}
.sc.on{border-color:var(--pr2);background:var(--soft)}
.sc .t{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;color:var(--mu)}
.sc .t span.lbl{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.ey{background:var(--soft);color:var(--tx);border-radius:8px;font-size:14px;padding:4px 8px}
.ey:active{transform:scale(.94)}
.sc .v{font-size:20px;font-weight:800;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;margin-top:6px;color:var(--tx)}
.sc i{display:block;font-style:normal;font-size:11.5px;color:var(--mu);margin-top:2px;font-weight:600}

/* Search & Filters */
.srch{position:relative;margin-bottom:10px}
.srch input{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 38px 11px 14px;font-size:15px;color:var(--tx);outline:none}
.srch input:focus{border-color:var(--pr2)}
.srch span{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;opacity:.6}

.filt{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.f{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:99px;padding:8px 15px;font-size:14px}
.f.on{background:var(--pr);color:#fff;border-color:var(--pr)}

/* Items List */
.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px 12px;box-shadow:0 2px 8px rgba(15,23,42,.03);cursor:pointer;transition:transform .1s}
.row:active{transform:scale(.99)}
.row.sel{border-color:var(--pr2);background:var(--soft)}
.chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;background:#fff}
.chk.on{background:var(--pr);border-color:var(--pr)}
.row .info{flex:1;min-width:0}
.row .title{display:flex;align-items:center;gap:7px;font-size:16.5px;font-weight:800;color:var(--tx)}
.row .title span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .subline{font-size:12px;color:var(--mu);font-weight:600;margin-top:4px;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:7px;font-size:11.5px;font-weight:700}
.badge.up{background:var(--okbg);color:var(--ok)}
.badge.ty{background:var(--soft);color:var(--pr)}
.row .right{display:flex;align-items:center;gap:7px;flex:none}
.row .am{font-size:19px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;color:var(--tx)}
.pls{width:40px;height:40px;border-radius:12px;background:var(--pr);color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(15,61,110,.22)}
.pls:active{transform:scale(.92)}

.ft{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px 16px;margin-top:12px;font-weight:800;font-size:15px}
.ft div{font-size:21px;direction:ltr;color:var(--pr);font-variant-numeric:tabular-nums}
.emp{text-align:center;color:var(--mu);padding:34px 16px;background:var(--card);border:1px dashed var(--bd);border-radius:16px;font-weight:600;line-height:1.8}
.hint{text-align:center;color:var(--mu);font-size:12.5px;margin-top:12px;font-weight:600}

/* Floating Add Button & Selection Bar */
.fab{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;border-radius:99px;padding:14px 22px;font-size:17px;box-shadow:0 8px 22px rgba(15,61,110,.32);z-index:15;display:flex;align-items:center;gap:6px}
.fab:active{transform:scale(.96)}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#0F172A;color:#fff;border-radius:16px;padding:10px 14px;display:none;gap:8px;align-items:center;z-index:20;max-width:576px;margin:auto;box-shadow:0 10px 25px rgba(15,23,42,.3)}
.selbar span{flex:1;font-weight:700;font-size:14.5px}
.selbar button{border-radius:10px;padding:10px 14px;font-size:14px;background:#fff;color:#0F172A}
.selbar button.g{background:var(--wa);color:#fff}

/* Bottom Sheet Modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:40}
.sh{background:var(--card);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sh .bar{width:42px;height:4px;background:#CBD5E1;border-radius:99px;margin:0 auto 12px}
.sh h2{margin:0 0 4px;font-size:20px;color:var(--tx)}
.sub{color:var(--mu);font-size:13.5px;font-weight:600;margin-bottom:6px}

label{display:block;font-size:13.5px;font-weight:700;margin:12px 0 6px;color:var(--mu)}
input.in{width:100%;font-size:18px;font-weight:700;padding:13px 14px;border:2px solid var(--bd);border-radius:14px;background:#fff;color:var(--tx);outline:none}
input.in:focus{border-color:var(--pr2)}
.amt{direction:ltr;text-align:right;font-size:32px!important;font-variant-numeric:tabular-nums;letter-spacing:.5px}

.ty{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:420px){.ty{grid-template-columns:repeat(4,1fr)}}
.t{border:2px solid var(--bd);background:#fff;color:var(--tx);border-radius:12px;padding:10px 6px;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.t.on{background:var(--soft);border-color:var(--pr2);color:var(--pr)}

.pv{margin-top:12px;background:var(--soft);border:1px solid #DBEAFE;border-radius:14px;padding:13px;font-size:15px;font-weight:700}
.pv .rowp{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:13.5px;color:var(--mu)}
.up{color:var(--ok)}.dn{color:var(--rd)}

.go{width:100%;margin-top:14px;background:var(--pr);color:#fff;border-radius:14px;padding:15px;font-size:18px}
.go:active{transform:scale(.99)}
.go.ok{background:var(--ok)}
.go.red{background:var(--rd)}
.go.gr{background:#F1F5F9;color:var(--tx)}
.go.wa{background:var(--wa)}
.go.s{padding:12px;font-size:15.5px;margin-top:8px}
.dl{width:100%;margin-top:10px;background:#fff;color:var(--rd);border:1px solid #FECACA;border-radius:14px;padding:12px;font-size:15px}
.er{color:var(--rd);font-weight:700;font-size:13.5px;min-height:18px;margin-top:6px}

/* Last Increase Highlight & History */
.lastbox{background:var(--okbg);border:1px solid #A7F3D0;border-radius:14px;padding:12px 14px;margin:10px 0 4px}
.lastbox .lt{font-size:12px;font-weight:800;color:var(--ok);margin-bottom:4px}
.lastbox .lv{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px}
.lastbox .ld{font-size:12px;color:#065F46;margin-top:3px;font-weight:600}

.hs{display:flex;align-items:center;gap:10px;padding:12px 2px;border-top:1px solid var(--bd)}
.hs .a{flex:1;min-width:0}
.hs .a b{font-size:14.5px;color:var(--tx)}
.hs .a i{display:block;font-style:normal;font-size:12px;color:var(--mu);font-weight:600;margin-top:2px}
.hs .nums{text-align:left;direction:ltr}
.hs .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ok)}
.hs .p{font-size:12px;font-weight:700;color:var(--ok)}
.hs button{background:var(--rdbg);border-radius:9px;width:32px;height:32px;color:var(--rd);font-size:14px;flex:none}

.pre{background:#F8FAFC;border:1px solid var(--bd);border-radius:14px;padding:12px;font-size:14.5px;white-space:pre-wrap;line-height:1.7;max-height:42vh;overflow:auto;user-select:text;-webkit-user-select:text}
.tr{display:flex;gap:8px;align-items:center;margin-top:8px}
.tr input{flex:1;font-size:16px!important;padding:11px!important}
.tr button{border:1px solid #FECACA;background:var(--rdbg);border-radius:10px;padding:10px 12px;color:var(--rd)}

/* PIN Lock Screen (z-index > overlay) */
.lk{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lk img{width:64px;height:64px;border-radius:16px;box-shadow:0 4px 14px rgba(15,23,42,.1)}
.lk h2{margin:0;font-size:21px;color:var(--pr)}
.lk .lsub{color:var(--mu);font-size:13.5px;font-weight:600;margin-top:-8px}
.dots{display:flex;gap:14px;direction:ltr;margin:4px 0}
.dots b{width:16px;height:16px;border-radius:50%;border:2px solid var(--pr);transition:all .12s}
.dots b.on{background:var(--pr);transform:scale(1.1)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:12px;direction:ltr}
.pad button{height:66px;border-radius:50%;border:1px solid var(--bd);background:#fff;font-size:25px;color:var(--tx);box-shadow:0 2px 8px rgba(15,23,42,.05)}
.pad button:active{background:var(--soft);transform:scale(.94)}
.lk .lnk{background:none;color:var(--pr2);font-size:14.5px;padding:8px 12px}
.lk-rec{width:100%;max-width:340px;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:var(--sh);display:none}
.lk-rec h3{margin:0 0 6px;font-size:18px;color:var(--pr)}

/* Toast */
.tst{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:#0F172A;color:#fff;border-radius:14px;padding:12px 16px;font-size:14.5px;font-weight:700;display:none;gap:14px;align-items:center;z-index:55;max-width:92vw;box-shadow:0 10px 25px rgba(15,23,42,.25)}
.tst button{background:none;color:#FBBF24;font-size:14.5px;padding:2px 6px}

/* Auth Screen */
.auth{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:420px;margin:auto;background:#fff;border:1px solid var(--bd);border-radius:24px;padding:24px;box-shadow:var(--sh)}
.auth-card .alogo{width:76px;height:76px;margin:0 auto 12px;border-radius:18px;display:block;box-shadow:0 4px 12px rgba(15,23,42,.1)}
.auth-card h2{color:var(--pr);margin:0 0 6px;font-size:22px;text-align:center}
.auth-card p{color:var(--mu);margin:0 0 14px;font-size:13.5px;line-height:1.6;text-align:center;font-weight:600}
</style>
</head>
<body>

<!-- شاشة الدخول للحساب السحابي -->
<div class="auth" id="authBox">
  <div class="auth-card">
    <img class="alogo" src="./icon-192.png" alt="ABO HANY CAPTAIN" onerror="this.style.display='none'">
    <h2>ABO HANY CAPTAIN</h2>
    <p>سجّل دخول بالإيميل والباسورد مرة واحدة لحفظ أرقامك ومزامنتها أوتوماتيك على السحابة والعمل أوفلاين.</p>
    <label>الإيميل</label>
    <input class="in" id="auEmail" type="email" dir="ltr" autocomplete="email" placeholder="example@gmail.com">
    <label>الباسورد</label>
    <input class="in" id="auPass" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••">
    <div class="er" id="auErr"></div>
    <button class="go" id="auBtn">دخول وتفعيل المزامنة</button>
    <button class="go gr s" id="auReset" type="button">نسيت باسورد الإيميل؟</button>
  </div>
</div>

<!-- الواجهة الرئيسية -->
<div class="wrap">
  <div class="hd">
    <div class="brand">
      <img src="./icon-192.png" alt="ABO HANY" onerror="this.style.display='none'">
      <div class="brand-t">
        <b>ABO HANY CAPTAIN</b>
        <span class="sync" id="syncBadge">☁ متصل</span>
      </div>
    </div>
    <div class="hacts">
      <button class="ibtn" id="all">👁 الكل</button>
      <button class="ibtn" data-a="exp" aria-label="تصدير">📤</button>
      <button class="ibtn" data-a="set" aria-label="الإعدادات">⚙</button>
    </div>
  </div>

  <div class="hero">
    <div class="top">
      <span>إجمالي الرصيد</span>
      <button class="eybtn" data-eye="total" id="etot" aria-label="إظهار أو إخفاء الإجمالي">👁</button>
    </div>
    <div class="val" id="total"></div>
    <div class="meta">
      <span id="hCount">0 بند</span>
      <span id="hSyncTime">جاهز</span>
    </div>
  </div>

  <div class="sum" id="sum"></div>

  <div class="srch">
    <span>🔍</span>
    <input id="q" type="search" autocomplete="off" placeholder="ابحث عن اسم بند...">
  </div>

  <div class="filt" id="filt"></div>
  <div class="list" id="list"></div>

  <div class="ft">
    <span id="flt">إجمالي المعروض</span>
    <div id="ftot"></div>
  </div>
  <div class="hint">اضغط ＋ لإضافة مبلغ بسرعة، أو اضغط على البند لعرض سجل الزيادات</div>
</div>

<button class="fab" data-a="new" id="fab">＋ بند جديد</button>

<div class="selbar" id="selbar">
  <span id="selc"></span>
  <button class="g" data-a="selgo">📤 واتساب</button>
  <button data-a="selx">إلغاء</button>
</div>

<!-- النافذة المنبثقة -->
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>

<!-- شاشة القفل بـ PIN -->
<div class="lk" id="lk">
  <img src="./icon-192.png" alt="ABO HANY" onerror="this.style.display='none'">
  <h2 id="lt"></h2>
  <div class="lsub" id="lsub"></div>
  <div class="dots" id="dots"></div>
  <div class="er" id="le"></div>
  <div class="pad" id="pad"></div>
  <button class="lnk" id="lsk"></button>
  <button class="lnk" id="lfg">نسيت الرمز؟ استرجاع بالإيميل</button>

  <div class="lk-rec" id="lkRec">
    <h3>استرجاع الرمز بالإيميل</h3>
    <div class="sub" id="recEmailTxt"></div>
    <label>كلمة مرور الإيميل</label>
    <input class="in" id="recPass" type="password" dir="ltr" autocomplete="current-password" placeholder="اكتب باسورد حسابك">
    <div class="er" id="rer"></div>
    <button class="go" id="rok">تحقق وتعيين رمز جديد</button>
    <button class="go gr s" id="recResetEmail">إرسال رابط إعادة تعيين لبريدك</button>
    <button class="go gr s" id="recBack">رجوع</button>
  </div>
</div>

<!-- إشعار التراجع -->
<div class="tst" id="ts"><span id="tm"></span><button id="un">تراجع</button></div>
<input type="file" id="fi" accept=".json" style="display:none">

<script>
var KEY = "hisabat-ahmed-v5";
var LEGACY_KEYS = ["hisabat-ahmed-v4", "hisabat-ahmed-v3", "hisabat-ahmed-v2"];
var DEFAULT_TYPES = [
  { name: "أساسي", color: "#0F3D6E" },
  { name: "خاص", color: "#7C3AED" },
  { name: "شغل", color: "#D97706" },
  { name: "أخرى", color: "#64748B" }
];
var PAL = ["#0E7490", "#BE185D", "#15803D", "#B45309", "#4338CA", "#9F1239"];

var D = {
  items: [],
  types: DEFAULT_TYPES.map(function(t){ return { name: t.name, color: t.color }; }),
  pin: null,
  asked: false,
  updatedAt: 0
};

var flt = "الكل", qText = "", rev = {}, undo = null, tt;
var selT = "", editId = null, P = { m: "", b: "", f: "", skip: false };
var selMode = false, SEL = {}, addId = null, fromDet = false, expList = [], uidn = 0, okTk = 0;

function $(i){ return document.getElementById(i); }
function uid(){ return Date.now() * 100 + (uidn++ % 100); }
function r2(n){ return Math.round((Number(n) || 0) * 100) / 100; }
function fmt(n){ return Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 }); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function digits(v){
  return String(v || "").replace(/[٠-٩]/g, function(d){ return "٠١٢٣٤٥٦٧٨٩".indexOf(d); });
}
function parseAmt(v){
  var s = digits(v).replace(/[٫]/g, ".").replace(/[٬,\s]/g, "");
  if(!s || !/^(\d+\.?\d*|\.\d+)$/.test(s)) return null;
  var n = Number(s);
  return isFinite(n) ? r2(n) : null;
}
function bal(it){
  return it.entries.reduce(function(a, e){ return r2(a + (Number(e.v) || 0)); }, 0);
}
function sumList(l){
  return l.reduce(function(a, b){ return r2(a + bal(b)); }, 0);
}
function cl(tName){
  var f = D.types.filter(function(x){ return x.name === tName; })[0];
  return f ? f.color : "#64748B";
}
function pct(prev, v){
  if(!(prev > 0)) return null;
  return Math.round((v / prev) * 1000) / 10;
}
function pcTxt(p){
  if(p === null) return "";
  return (p >= 0 ? "+" : "") + p.toLocaleString("en-US", { maximumFractionDigits: 1 }) + "%";
}
function dt(ts){
  try{ return new Date(ts).toLocaleDateString("ar-EG-u-nu-latn", { day: "numeric", month: "short", year: "numeric" }); }
  catch(e){ return new Date(ts).toLocaleDateString(); }
}
function tm(ts){
  try{ return new Date(ts).toLocaleTimeString("ar-EG-u-nu-latn", { hour: "2-digit", minute: "2-digit" }); }
  catch(e){ return ""; }
}
function hash(p){
  var h = 5381, s = "hs" + p + "26";
  for(var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return String(h);
}
function V(k, n){ return rev[k] ? fmt(n) : "••••"; }
function E(k){
  return '<button class="ey" data-eye="' + k + '" aria-label="إظهار أو إخفاء">' + (rev[k] ? "🙈" : "👁") + '</button>';
}

/* توحيد وتنظيف البيانات القديمة والجديدة بدون nested arrays */
function normalizeTypes(arr){
  if(!Array.isArray(arr) || !arr.length){
    return DEFAULT_TYPES.map(function(t){ return { name: t.name, color: t.color }; });
  }
  var out = [], seen = {};
  arr.forEach(function(t, idx){
    var name = "", color = PAL[idx % PAL.length];
    if(Array.isArray(t)){
      name = String(t[0] || "").trim();
      color = String(t[1] || color);
    } else if(t && typeof t === "object"){
      name = String(t.name || "").trim();
      color = String(t.color || color);
    }
    if(name && !seen[name]){
      seen[name] = true;
      out.push({ name: name, color: color });
    }
  });
  return out.length ? out : DEFAULT_TYPES.map(function(t){ return { name: t.name, color: t.color }; });
}

function migItem(x, i){
  var it = {
    id: Number(x.id) || (uid() + i),
    name: String(x.name || "بدون اسم"),
    type: String(x.type || "أخرى"),
    entries: []
  };
  if(Array.isArray(x.entries)){
    it.entries = x.entries.map(function(e, j){
      return {
        id: Number(e.id) || (uid() + j),
        v: Number(e.v) || 0,
        ts: Number(e.ts) || Date.now(),
        n: String(e.n || "")
      };
    });
  } else {
    var oldAmt = Number(x.amount) || 0;
    if(oldAmt !== 0){
      it.entries = [{ id: uid(), v: oldAmt, ts: Number(x.ts) || Date.now(), n: "رصيد سابق" }];
    }
  }
  return it;
}

function fixTypes(){
  D.types = normalizeTypes(D.types);
  D.items.forEach(function(it){
    if(!D.types.some(function(t){ return t.name === it.type; })){
      D.types.push({ name: it.type, color: PAL[D.types.length % PAL.length] });
    }
  });
}

(function loadLocal(){

    if(raw){

        if(o.types) D.types = normalizeTypes(o.types);

})();

function detail(id){
  var it = find(id);
  if(!it) return;
  var run = 0, rows = [];
  it.entries.forEach(function(e, i){
    var p = i === 0 ? null : pct(run, e.v);
    run = r2(run + e.v);
    rows.push({ e: e, p: p, after: run, first: i === 0 });
  });

  var lastBox = "";
  if(rows.length){
    var last = rows[rows.length - 1];
    var lp = last.p !== null ? ('▲ زيادة بنسبة ' + pcTxt(last.p).replace(/^\+/, '')) : 'رصيد البداية';
    lastBox =
      '<div class="lastbox">' +
        '<div class="lt">شرح الزيادة الأخيرة</div>' +
        '<div class="lv"><span dir="ltr">+' + fmt(last.e.v) + ' جنيه</span><span>' + lp + '</span></div>' +
        '<div class="ld">' + dt(last.e.ts) + ' • ' + tm(last.e.ts) + (last.e.n ? ' • ' + esc(last.e.n) : '') + '</div>' +
      '</div>';
  }

  var h = rows.slice().reverse().map(function(r){
    var e = r.e;
    return '<div class="hs">' +
      '<div class="a">' +
        '<b>' + (e.n ? esc(e.n) : (r.first ? 'أول رصيد' : 'زيادة جديدة')) + '</b>' +
        '<i>' + dt(e.ts) + ' • ' + tm(e.ts) + ' • الرصيد بعدها: ' + fmt(r.after) + '</i>' +
      '</div>' +
      '<div class="nums">' +
        '<div class="v">+' + fmt(e.v) + '</div>' +
        (r.p !== null ? '<div class="p">' + pcTxt(r.p) + '</div>' : '') +
      '</div>' +
      '<button type="button" data-a="dele" data-id="' + it.id + '" data-v="' + e.id + '" aria-label="حذف الحركة">✕</button>' +

  }).join("");

  open(
    '<h2>' + esc(it.name) + '</h2>' +
    '<div class="sub">' + esc(it.type) + ' • الرصيد الحالي</div>' +
    '<div style="font-size:34px;font-weight:800;color:var(--pr);direction:ltr;text-align:right;margin-bottom:6px">' + fmt(bal(it)) + ' <small style="font-size:15px;color:var(--mu)">جنيه</small></div>' +

    '</div>' +
    '<label>سجل الزيادات (' + it.entries.length + ')</label>' +
    (h || '<div class="emp">لا توجد زيادات مسجلة بعد</div>') +
    '<button type="button" class="dl" data-a="deli" data-id="' + it.id + '">🗑 مسح البند بالكامل</button>' +
    '<button type="button" class="go gr s" data-a="cn">إغلاق</button>'
  );
}

function tmg(){

function applyTy(){
  var ins = document.querySelectorAll("[data-ti]"), seen = {}, map = [];
  for(var k = 0; k < ins.length; k++){
    var i = +ins[k].dataset.ti;
    var nn = ins[k].value.trim() || D.types[i].name;
    if(seen[nn]) return "لازم أسماء الأنواع تكون مختلفة";
    seen[nn] = 1;
    map.push([D.types[i].name, nn]);
  }
  map.forEach(function(m, i){
    if(m[0] !== m[1]){
      D.items.forEach(function(it){ if(it.type === m[0]) it.type = m[1]; });
      if(flt === m[0]) flt = m[1];
      D.types[i].name = m[1];
    }
  });
  return "";
}

function backup(){
  var b = new Blob([JSON.stringify({ v: 5, items: D.items, types: D.types })], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "abohany-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast("تم تنزيل النسخة الاحتياطية ✓", false);
}

/* ---- شاشة القفل بـ PIN واسترجاعه بالإيميل ---- */
function lock(m, skip){
  P.m = m; P.b = ""; P.f = ""; P.skip = !!skip;
  $("lkRec").style.display = "none";
  $("pad").style.display = "grid";
  $("dots").style.display = "flex";
  $("le").textContent = "";
  pinUI();
  $("lk").style.display = "flex";
}

function pinUI(){
  var t = { unlock: "اكتب باسورد التطبيق", s1: "اختر باسورد من 4 أرقام", s2: "أعد كتابة الباسورد للتأكيد" }[P.m];
  var s = { unlock: "ABO HANY CAPTAIN", s1: "لحماية أرقامك عند فتح الصفحة", s2: "اكتب نفس الـ 4 أرقام مرة تانية" }[P.m];
  $("lt").textContent = t;
  $("lsub").textContent = s;
  $("dots").innerHTML = [0, 1, 2, 3].map(function(i){
    return '<b class="' + (i < P.b.length ? 'on' : '') + '"></b>';
  }).join("");
  $("pad").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].map(function(k){
    return k === "" ? '<span></span>' : '<button type="button" data-k="' + k + '">' + k + '</button>';
  }).join("");
  $("lsk").style.display = P.skip ? "" : "none";
  $("lsk").textContent = (D.pin && P.m !== "unlock") ? "إلغاء" : "تخطي الآن";
  $("lfg").style.display = P.m === "unlock" ? "" : "none";
}

function key(k){
  $("le").textContent = "";
  if(k === "⌫") P.b = P.b.slice(0, -1);
  else if(P.b.length < 4) P.b += k;
  pinUI();
  if(P.b.length < 4) return;
  setTimeout(function(){
    if(P.m === "unlock"){
      if(hash(P.b) === D.pin){
        $("lk").style.display = "none";
      } else {
        P.b = ""; pinUI();
        $("le").textContent = "الباسورد غلط، جرّب تاني";
      }
    } else if(P.m === "s1"){
      P.f = P.b; P.b = ""; P.m = "s2"; pinUI();
    } else {
      if(P.b === P.f){
        D.pin = hash(P.b);
        $("lk").style.display = "none";
        save();
        toast("تم حفظ باسورد القفل ✓", false);
      } else {
        P.b = ""; P.f = ""; P.m = "s1"; pinUI();
        $("le").textContent = "الرقمين مش متطابقين، ابدأ تاني";
      }
    }
  }, 110);
}

/* ---- معالج الأحداث ---- */
function act(a, d){
  var id = d.dataset.id, v = d.dataset.v;
  switch(a){
    case "flt": flt = v; render(); break;
    case "cardflt": flt = (flt === v ? "الكل" : v); render(); break;
    case "new": fromDet = false; form(null); break;
    case "add": openAdd(id, false); break;
    case "addd": openAdd(id, true); break;
    case "svadd": saveAdd(); break;
    case "edit": fromDet = true; form(find(id)); break;
    case "svitem": saveItem(); break;
    case "st": selT = v; tys(); break;
    case "deli":
      var it = find(id);
      open('<h2>مسح «' + esc(it.name) + '»؟</h2><div class="sub">هيتم مسح البند وكل سجل الزيادات بتاعه</div><button type="button" class="go red" data-a="yd" data-id="' + id + '">نعم، امسح</button><button type="button" class="go gr" data-a="cn">إلغاء</button>');
      break;
    case "yd": delItem(id); break;
    case "dele": delEntry(id, v); break;
    case "cn": close(); break;
    case "exp": expMenu(); break;
    case "exall": expOpen(D.items.slice(), "كل البنود"); break;
    case "exflt": expOpen(D.items.filter(function(i){ return i.type === flt; }), "بنود " + flt); break;
    case "exsel": close(); selMode = true; SEL = {}; render(); toast("اختار البنود ثم اضغط واتساب", false); break;
    case "exone": expOpen([find(id)], find(id).name); break;
    case "selgo": expOpen(D.items.filter(function(i){ return SEL[i.id]; }), "البنود المحددة"); break;
    case "selx": selMode = false; SEL = {}; render(); break;
    case "wa": window.open("https://wa.me/?text=" + encodeURIComponent(expText(expList)), "_blank"); break;
    case "cp": copyTxt(expText(expList)); break;
    case "sh":
      if(navigator.share) navigator.share({ text: expText(expList) }).catch(function(){});
      else copyTxt(expText(expList));
      break;
    case "set": settings(); break;
    case "bk": backup(); break;
    case "rs": $("fi").click(); break;
    case "pin": close(); lock("s1", true); break;
    case "nopin": D.pin = null; save(); settings(); toast("تم إلغاء باسورد القفل", false); break;
    case "yes-rs":
      close();
      if(window._rs){
        D.items = window._rs.items;
        if(window._rs.types) D.types = normalizeTypes(window._rs.types);
        fixTypes(); SEL = {}; selMode = false;
        render(); save();
        toast("تم استرجاع النسخة ✓", false);
      }
      break;
    case "tmg": tmg(); break;
    case "addty":
      applyTy();
      D.types.push({ name: "نوع " + (D.types.length + 1), color: PAL[D.types.length % PAL.length] });
      save(); tmg();
      break;
    case "delty":
      applyTy();
      var ix = +id;
      if(D.types.length < 2){ $("er").textContent = "لازم يفضل نوع واحد على الأقل"; break; }
      var gone = D.types.splice(ix, 1)[0].name, to = D.types[0].name;
      D.items.forEach(function(i){ if(i.type === gone) i.type = to; });
      render(); save(); tmg();
      break;
    case "svty":
      var er = applyTy();
      if(er){ $("er").textContent = er; break; }
      close(); render(); save();
      toast("تم حفظ الأنواع ✓", false);
      break;
    case "logout":
      if(window._fbLogout){ close(); window._fbLogout(); }
      break;
  }
}

function copyTxt(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast("تم النسخ ✓", false); }, selPre);
  } else selPre();
}
function selPre(){
  var p = $("pre");
  if(p){
    var r = document.createRange(); r.selectNodeContents(p);
    var s = getSelection(); s.removeAllRanges(); s.addRange(r);
    toast("حدّد النص وانسخه", false);
  }
}

document.addEventListener("click", function(e){
  var el = e.target, d;
  if(d = el.closest("[data-eye]")){
    var k = d.dataset.eye;
    if(rev[k]) delete rev[k]; else rev[k] = true;
    render(); return;
  }
  if(d = el.closest("[data-k]")){ key(d.dataset.k); return; }
  if(d = el.closest("[data-a]")){ act(d.dataset.a, d); return; }
  if(d = el.closest(".row")){
    var id = +d.dataset.id;
    if(selMode){
      if(SEL[id]) delete SEL[id]; else SEL[id] = true;
      render();
    } else {
      detail(id);
    }
    return;
  }
  if(el.id === "ov") close();
  else if(el.id === "all"){
    if(Object.keys(rev).length) rev = {};
    else{
      rev = { total: true };
      D.types.forEach(function(t){ rev["ty:" + t.name] = true; });
      D.items.forEach(function(i){ rev["i:" + i.id] = true; });
    }
    render();
  }
  else if(el.id === "un"){ if(undo){ undo(); undo = null; } $("ts").style.display = "none"; }
  else if(el.id === "lsk"){ $("lk").style.display = "none"; }
  else if(el.id === "lfg"){
    var em = (window._fbUser && window._fbUser.email) ? window._fbUser.email : "";
    $("recEmailTxt").textContent = em ? ("الحساب: " + em) : "يلزم تسجيل الدخول بالإيميل أولاً";
    $("recPass").value = ""; $("rer").textContent = "";
    $("pad").style.display = "none"; $("dots").style.display = "none";
    $("lsk").style.display = "none"; $("lfg").style.display = "none";
    $("lkRec").style.display = "block";
    setTimeout(function(){ $("recPass").focus(); }, 100);
  }
  else if(el.id === "recBack"){ lock("unlock", false); }
  else if(el.id === "rok"){
    if(window._fbVerifyForPin) window._fbVerifyForPin($("recPass").value);
  }
  else if(el.id === "recResetEmail"){
    if(window._fbSendReset) window._fbSendReset();
  }
});

$("q").addEventListener("input", function(){ qText = this.value; render(); });
document.addEventListener("input", function(e){ if(e.target.id === "ad") pv(); });
document.addEventListener("keydown", function(e){
  if(e.key === "Enter" && $("ov").style.display === "flex"){
    if($("ad")) saveAdd();
    else if($("nm") && document.querySelector('[data-a="svitem"]')) saveItem();
  }
});

$("fi").onchange = function(){
  var f = this.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var o = JSON.parse(r.result);
      if(!o || !Array.isArray(o.items)) throw 0;
      window._rs = { items: o.items.map(migItem), types: (o.types && o.types.length) ? o.types : null };
      open('<h2>استرجاع نسخة احتياطية؟</h2><div class="sub">هيتم استبدال البنود الحالية بالنسخة المختارة</div><button type="button" class="go red" data-a="yes-rs">نعم، استرجع</button><button type="button" class="go gr" data-a="cn">إلغاء</button>');
    }catch(err){ toast("الملف غير صالح", false); }
  };
  r.readAsText(f);
  this.value = "";
};

document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    rev = {}; render();
    if(D.pin && $("lk").style.display !== "flex" && $("authBox").style.display !== "flex"){
      lock("unlock", false);
    }
  }
});

try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
render();
if(D.pin) lock("unlock", false);
</script>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyDhZq569vl-hnPZaFiQwyCSle9ktELszYM",
    authDomain: "my-money-app-707a4.firebaseapp.com",
    projectId: "my-money-app-707a4",
    storageBucket: "my-money-app-707a4.firebasestorage.app",
    messagingSenderId: "333500825466",
    appId: "1:333500825466:web:3a44fd337134412cbe20c3",
    measurementId: "G-TP65V5M225"
  };

  var badge = $("syncBadge");
  function setBadge(txt, cls){
    if(!badge) return;
    badge.textContent = txt;
    badge.className = "sync" + (cls ? " " + cls : "");
  }

  function updateNetStatus(){
    if(!navigator.onLine) setBadge("📴 أوفلاين (محفوظ)", "off");
    else if(window._fbUser) setBadge("☁ متزامن", "");
    else setBadge("🔒 غير مسجل", "off");
  }
  window.addEventListener("online", updateNetStatus);
  window.addEventListener("offline", updateNetStatus);
  updateNetStatus();

  if(typeof firebase === "undefined"){
    setBadge("📴 وضع محلي", "off");
    if(!D.pin && !D.asked){ D.asked = true; save(); lock("s1", true); }
    return;
  }

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  db.enablePersistence({ synchronizeTabs: true }).catch(function(err){
    console.warn("Persistence:", err.code);
  });

  var unsubDoc = null, saveTimer = null, initialChecked = false;

  function buildPayload(){
    return {
      v: 5,
      items: (D.items || []).map(function(it){
        return {
          id: Number(it.id),
          name: String(it.name || ""),
          type: String(it.type || "أخرى"),
          entries: (it.entries || []).map(function(e){
            return { id: Number(e.id), v: Number(e.v) || 0, ts: Number(e.ts) || Date.now(), n: String(e.n || "") };
          })
        };
      }),
      types: normalizeTypes(D.types).map(function(t){
        return { name: String(t.name), color: String(t.color) };
      }),
      pin: D.pin || null,
      asked: !!D.asked,
      updatedAt: Number(D.updatedAt) || Date.now()
    };
  }

  function doSaveCloud(){
    if(!window._fbUser) return;
    try{
      var ref = db.collection("users").doc(window._fbUser.uid).collection("app").doc("main");
      var payload = buildPayload();
      if(navigator.onLine) setBadge("⏳ جاري الحفظ...", "off");
      ref.set(payload).then(function(){
        updateNetStatus();
        $("hSyncTime").textContent = "آخر حفظ " + tm(Date.now());
      }).catch(function(e){
        console.error("Cloud save error:", e);
        if(!navigator.onLine) setBadge("📴 محفوظ أوفلاين", "off");
        else setBadge("⚠ تعذر الرفع", "err");
      });
    }catch(err){
      console.error("Payload error:", err);
      setBadge("⚠ خطأ مزامنة", "err");
    }
  }

  window._fbScheduleSave = function(){
    if(!window._fbUser) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSaveCloud, 200);
  };

  window._fbLogout = function(){
    if(unsubDoc){ unsubDoc(); unsubDoc = null; }
    auth.signOut().then(function(){
      window._fbUser = null;
      $("authBox").style.display = "flex";
      updateNetStatus();
    });
  };

  /* استرجاع رمز PIN بالتحقق من باسورد الإيميل */
  window._fbVerifyForPin = function(pw){
    var user = auth.currentUser;
    if(!user || !user.email){ $("rer").textContent = "لا يوجد حساب مسجل"; return; }
    if(!navigator.onLine){ $("rer").textContent = "تحتاج للاتصال بالإنترنت للتحقق من الإيميل"; return; }
    if(!pw){ $("rer").textContent = "اكتب كلمة مرور الإيميل"; return; }
    $("rok").disabled = true; $("rok").textContent = "جاري التحقق...";
    $("rer").textContent = "";
    var cred = firebase.auth.EmailAuthProvider.credential(user.email, pw);
    user.reauthenticateWithCredential(cred).then(function(){
      D.pin = null;
      save();
      lock("s1", true);
      toast("تم التحقق! اختر رمز جديد الآن", false);
    }).catch(function(err){
      var msg = "كلمة المرور غير صحيحة";
      if(err.code === "auth/too-many-requests") msg = "محاولات كتير، انتظر دقيقة وجرّب تاني";
      else if(err.code === "auth/network-request-failed") msg = "مفيش اتصال بالإنترنت";
      $("rer").textContent = msg;
    }).finally(function(){
      $("rok").disabled = false; $("rok").textContent = "تحقق وتعيين رمز جديد";
    });
  };

  window._fbSendReset = function(){
    var email = (auth.currentUser && auth.currentUser.email) || $("auEmail").value.trim();
    if(!email){ toast("اكتب الإيميل الأول", false); return; }
    if(!navigator.onLine){ toast("يلزم اتصال بالإنترنت لإرسال الرابط", false); return; }
    auth.sendPasswordResetEmail(email).then(function(){
      toast("تم إرسال رابط تغيير الباسورد إلى " + email, false);
    }).catch(function(){
      toast("تعذر إرسال الرابط، تأكد من الإيميل", false);
    });
  };

  $("auBtn").onclick = function(){
    var em = $("auEmail").value.trim(), pw = $("auPass").value;
    $("auErr").textContent = "";
    if(!em || !pw){ $("auErr").textContent = "اكتب الإيميل والباسورد"; return; }
    $("auBtn").disabled = true; $("auBtn").textContent = "جاري الدخول...";
    auth.signInWithEmailAndPassword(em, pw).catch(function(err){
      var msg = "تأكد من الإيميل والباسورد";
      if(err.code === "auth/network-request-failed") msg = "تأكد من اتصال الإنترنت لأول تسجيل دخول";
      else if(err.code === "auth/invalid-email") msg = "صيغة الإيميل غير صحيحة";
      else if(err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") msg = "الإيميل أو الباسورد غير صحيح";
      $("auErr").textContent = msg;
    }).finally(function(){
      $("auBtn").disabled = false; $("auBtn").textContent = "دخول وتفعيل المزامنة";
    });
  };

  $("auPass").addEventListener("keydown", function(e){
    if(e.key === "Enter") $("auBtn").click();
  });
  $("auReset").onclick = window._fbSendReset;

  auth.onAuthStateChanged(function(user){
    window._fbUser = user;
    if(!user){
      $("authBox").style.display = "flex";
      updateNetStatus();
      return;
    }

    $("authBox").style.display = "none";
    updateNetStatus();

    var ref = db.collection("users").doc(user.uid).collection("app").doc("main");
    if(unsubDoc) unsubDoc();
    initialChecked = false;

    unsubDoc = ref.onSnapshot({ includeMetadataChanges: true }, function(snap){
      if(!snap.exists){
        if(!initialChecked){
          initialChecked = true;
          doSaveCloud();
          if(!D.pin && !D.asked){ D.asked = true; save(); lock("s1", true); }
        }
        return;
      }

      initialChecked = true;
      var cd = snap.data();
      if(!cd) return;

      var cloudTime = Number(cd.updatedAt) || 0;
      var localTime = Number(D.updatedAt) || 0;
      var hasCloudItems = Array.isArray(cd.items) && cd.items.length > 0;
      var hasLocalItems = D.items && D.items.length > 0;

      /* تطبيق بيانات السحابة لو أحدث أو لو الجهاز فاضي تماماً لأول مرة */
      if(cloudTime > localTime || (localTime === 0 && !hasLocalItems && hasCloudItems)){
        D.items = Array.isArray(cd.items) ? cd.items.map(migItem) : [];
        if(cd.types) D.types = normalizeTypes(cd.types);
        if(cd.pin !== undefined) D.pin = cd.pin;
        if(cd.asked !== undefined) D.asked = cd.asked;
        D.updatedAt = cloudTime || Date.now();
        fixTypes();
        save(true);
        render();

        /* لو بيانات السحابة كانت بالصيغة القديمة (مصفوفة متداخلة)، نحدثها للصيغة السليمة أوتوماتيك */
        if(Array.isArray(cd.types) && Array.isArray(cd.types[0])){
          doSaveCloud();
        }
      } else if(localTime > cloudTime && !snap.metadata.hasPendingWrites){
        doSaveCloud();
      }

      if(D.pin && $("lk").style.display !== "flex" && !window._pinCheckedOnce){
        window._pinCheckedOnce = true;
        lock("unlock", false);
      } else if(!D.pin && !D.asked){
        D.asked = true; save(); lock("s1", true);
      }

      if(snap.metadata.fromCache){
        setBadge("📴 محفوظ أوفلاين", "off");
      } else {
        setBadge("☁ متزامن", "");
        $("hSyncTime").textContent = "متزامن " + tm(Date.now());
      }
    }, function(err){
      console.warn("Snapshot error:", err);
      updateNetStatus();
    });
  });
})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.update();
    }).catch(function(err){
      console.log('SW error:', err);
    });
  });
}
</script>
</body>
