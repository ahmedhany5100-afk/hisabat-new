<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابات أحمد</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="حسابات">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light">
<style>
:root{--bg:#fff;--tx:#111827;--mu:#6B7280;--bd:#E5E7EB;--pr:#1F4E79;--soft:#F3F6FA;--rd:#DC2626;--ok:#047857;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
button{cursor:pointer;font-weight:700}
.w{max-width:640px;margin:auto;padding:14px 16px 130px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
h1{font-size:22px;margin:0;color:var(--pr)}
.sm{border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:12px;padding:9px 11px;font-size:14px}
.tot{border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:12px}
.tot .l{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:16px;font-weight:700}
.big{font-size:46px;font-weight:800;line-height:1.25;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;color:var(--pr)}
.big small{font-size:18px;color:var(--mu);font-weight:700;margin-left:6px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sc{border:1px solid var(--bd);border-radius:16px;padding:12px}
.sc .t{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;color:var(--mu)}
.sc .v{font-size:22px;font-weight:800;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.sc i{font-style:normal;font-size:12px;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;flex:none}
.ey{border:0;background:var(--soft);border-radius:10px;font-size:16px;padding:5px 9px;color:var(--tx)}
.filt{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.f{flex:none;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:99px;padding:8px 16px;font-size:15px}
.f.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.row{display:flex;align-items:center;gap:10px;padding:14px 4px;border-top:1px solid var(--bd)}
.row.sel{background:var(--soft)}
.row .nm{flex:1;min-width:0;font-size:18px;font-weight:700;cursor:pointer}
.row .nm i{display:block;font-style:normal;font-size:13px;color:var(--mu);font-weight:600}
.row .nm b{font-size:12.5px;font-weight:700}
.row .am{font-size:22px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.pls{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:24px;line-height:1}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.chk.on{background:var(--pr);border-color:var(--pr)}
.ft{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--tx);padding-top:12px;margin-top:2px;font-weight:800;font-size:17px}
.ft div{font-size:26px;direction:ltr;color:var(--pr);font-variant-numeric:tabular-nums}
.emp{text-align:center;color:var(--mu);padding:30px 0}
.hint{text-align:center;color:var(--mu);font-size:13px;margin-top:10px}
.fab{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;border:0;border-radius:99px;padding:16px 24px;font-size:19px;box-shadow:0 6px 20px rgba(31,78,121,.3);z-index:5}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;border-radius:16px;padding:10px 12px;display:none;gap:8px;align-items:center;z-index:6;max-width:616px;margin:auto}
.selbar span{flex:1;font-weight:700;font-size:15px}
.selbar button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;background:#fff;color:#111827}
.selbar button.g{background:#25D366;color:#fff}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
.sh{background:#fff;width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sh h2{margin:0 0 6px;font-size:20px}
.sub{color:var(--mu);font-size:14px;font-weight:600;margin-bottom:4px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px;color:var(--mu)}
input.in{width:100%;font-size:20px;font-weight:700;padding:14px;border:2px solid var(--bd);border-radius:14px;background:#fff;color:var(--tx);outline:none}
input.in:focus{border-color:var(--pr)}
.amt{direction:ltr;text-align:right;font-size:30px!important;font-variant-numeric:tabular-nums}
.ty{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t{border:2px solid var(--bd);background:#fff;color:var(--tx);border-radius:12px;padding:11px 2px;font-size:15px}
.t.on{background:var(--pr);border-color:var(--pr);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;direction:ltr}
.ops button{border:1px solid var(--bd);background:var(--soft);border-radius:12px;padding:10px 0;font-size:22px;color:var(--tx)}
.pv{margin-top:12px;background:var(--soft);border-radius:14px;padding:12px;font-size:16px;font-weight:700;min-height:48px}
.pv small{display:block;color:var(--mu);font-weight:600;font-size:13px}
.up{color:var(--ok)}.dn{color:var(--rd)}
.go{width:100%;margin-top:14px;background:var(--pr);color:#fff;border:0;border-radius:14px;padding:16px;font-size:20px}
.go.red{background:var(--rd)}.go.gr{background:var(--soft);color:var(--tx)}.go.wa{background:#25D366}
.go.s{padding:13px;font-size:17px;margin-top:10px}
.dl{width:100%;margin-top:10px;background:#fff;color:var(--rd);border:1px solid var(--bd);border-radius:14px;padding:13px;font-size:16px}
.er{color:var(--rd);font-weight:700;font-size:14px;min-height:20px;margin-top:6px}
.hs{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--bd)}
.hs .a{flex:1;min-width:0}
.hs .a i{display:block;font-style:normal;font-size:12.5px;color:var(--mu);font-weight:600}
.hs .v{font-size:19px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.hs .p{font-size:12.5px;font-weight:700;direction:ltr;text-align:left}
.hs button{border:0;background:var(--soft);border-radius:8px;width:30px;height:30px;color:var(--mu)}
.pre{background:var(--soft);border-radius:14px;padding:12px;font-size:15px;white-space:pre-wrap;line-height:1.7;max-height:42vh;overflow:auto;user-select:text;-webkit-user-select:text}
.tr{display:flex;gap:8px;align-items:center;margin-top:8px}
.tr input{flex:1;font-size:17px!important;padding:11px!important}
.tr button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:10px 12px;color:var(--rd)}
.lk{position:fixed;inset:0;background:#fff;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lk h2{margin:0;font-size:22px;color:var(--pr)}
.dots{display:flex;gap:14px;direction:ltr}.dots b{width:18px;height:18px;border-radius:50%;border:2px solid var(--pr)}.dots b.on{background:var(--pr)}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:12px;direction:ltr}
.pad button{height:68px;border-radius:50%;border:1px solid var(--bd);background:var(--soft);font-size:26px;color:var(--tx)}
.pad button:active{background:var(--bd)}
.lk .lnk{border:0;background:none;color:var(--mu);font-size:15px;padding:8px}
.tst{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;display:none;gap:14px;align-items:center;z-index:45;max-width:92vw}
.tst button{background:none;border:0;color:#FBBF24;font-size:15px}
</style></head>
<body>
<div class="w">
  <div class="hd"><h1>حسابات أحمد</h1><div><button class="sm" id="all">👁 الكل</button> <button class="sm" data-a="exp">📤</button> <button class="sm" data-a="set">⚙</button></div></div>
  <div class="tot"><div class="l"><span>الإجمالي</span><button class="ey" data-eye="total" id="etot"></button></div><div class="big" id="total"></div></div>
  <div class="sum" id="sum"></div>
  <div class="filt" id="filt"></div>
  <div id="list"></div>
  <div class="ft"><span id="flt">إجمالي المعروض</span><div id="ftot"></div></div>
  <div class="hint">اضغط ＋ لإضافة مبلغ على البند، أو اضغط اسم البند لعرض سجله</div>
</div>
<button class="fab" data-a="new" id="fab">＋ بند جديد</button>
<div class="selbar" id="selbar"><span id="selc"></span><button class="g" data-a="selgo">📤 واتساب</button><button data-a="selx">إلغاء</button></div>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div class="lk" id="lk"><h2 id="lt"></h2><div class="dots" id="dots"></div><div class="er" id="le"></div><div class="pad" id="pad"></div><button class="lnk" id="lsk"></button><button class="lnk" id="lfg">نسيت الرمز؟</button></div>
<div class="tst" id="ts"><span id="tm"></span><button id="un">تراجع</button></div>
<input type="file" id="fi" accept=".json" style="display:none">

<script>
var KEY="hisabat-ahmed-v4";
var TYD=[["أساسي","#1F4E79"],["خاص","#7C3AED"],["شغل","#D97706"],["أخرى","#6B7280"]];
var PAL=["#0E7490","#BE185D","#15803D","#B45309","#4338CA","#9F1239"];
var D={items:[],types:TYD.map(function(t){return t.slice()}),pin:null,rec:null,asked:false};
var flt="الكل",rev={},undo=null,tt,selT="",editId=null,P={m:"",b:"",f:"",skip:false},selMode=false,SEL={},addId=null,addMode="add",fromDet=false,expList=[],uidn=0;
function $(i){return document.getElementById(i)}
function uid(){return Date.now()*100+(uidn++%100)}
function r2(n){return Math.round(n*100)/100}
function fmt(n){return Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2})}
function sg(n){return (n>0?"+":"")+fmt(n)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function bal(it){return it.entries.reduce(function(a,e){return r2(a+e.v)},0)}
function sum(l){return l.reduce(function(a,b){return r2(a+bal(b))},0)}
function cl(t){var f=D.types.filter(function(x){return x[0]===t})[0];return f?f[1]:"#6B7280"}
function digits(v){return String(v||"").replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)})}
function calc(s){
  s=digits(s).replace(/[×xX]/g,"*").replace(/÷/g,"/").replace(/[−–]/g,"-").replace(/[٫]/g,".").replace(/[٬,\s]/g,"");
  if(!s||!/^[0-9.+\-*\/()]+$/.test(s))return null;
  try{var v=Function('"use strict";return ('+s+')')();return isFinite(v)?r2(v):null}catch(e){return null}
}
function pct(prev,v){if(!(prev>0))return null;return Math.round(v/prev*1000)/10}
function pcTxt(p){return p===null?"":(p>0?"+":"")+p.toLocaleString("en-US")+"%"}
function dt(ts){try{return new Date(ts).toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"short",year:"numeric"})}catch(e){return new Date(ts).toLocaleDateString()}}
function tm(ts){try{return new Date(ts).toLocaleTimeString("ar-EG-u-nu-latn",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function hash(p){var h=5381,s="hs"+p+"26";for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
function V(k,n){return rev[k]?fmt(n):"••••"}
function E(k){return '<button class="ey" data-eye="'+k+'" aria-label="إظهار/إخفاء">'+(rev[k]?"🙈":"👁")+'</button>'}
function mig(x,i){
  var it={id:x.id||uid()+i,name:String(x.name||"بدون اسم"),type:x.type||"أخرى"};
  if(Array.isArray(x.entries))it.entries=x.entries.map(function(e,j){return {id:e.id||uid()+j,v:Number(e.v)||0,ts:e.ts||Date.now(),n:e.n||""}});
  else it.entries=[{id:uid(),v:Number(x.amount)||0,ts:x.ts||Date.now(),n:"رصيد سابق"}];
  return it;
}
function fixTypes(){D.items.forEach(function(i){if(!D.types.some(function(t){return t[0]===i.type}))D.types.push([i.type,"#6B7280"])})}
try{var s=localStorage.getItem(KEY)||localStorage.getItem("hisabat-ahmed-v3")||localStorage.getItem("hisabat-ahmed-v2");
  if(s){var o=JSON.parse(s);if(o&&o.items)D.items=o.items.map(mig);if(o&&o.types&&o.types.length)D.types=o.types;if(o&&o.pin)D.pin=o.pin;if(o&&o.rec)D.rec=o.rec;if(o&&o.asked)D.asked=true;fixTypes()}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("تعذر الحفظ على الجهاز",false)}}

function render(){
  var all=D.items,tot=sum(all);
  $("total").innerHTML='<small>جنيه</small>'+V("total",tot);$("etot").textContent=rev.total?"🙈":"👁";
  $("sum").innerHTML=D.types.map(function(t){var l=all.filter(function(i){return i.type===t[0]}),s=sum(l),k="ty:"+t[0];
    return '<div class="sc"><div class="t"><span><span class="dot" style="background:'+t[1]+'"></span>'+esc(t[0])+'</span>'+E(k)+'</div><div class="v">'+V(k,s)+'</div><i>'+l.length+' بند'+(tot>0&&rev[k]?' • '+Math.round(s/tot*100)+'% من الإجمالي':'')+'</i></div>'}).join("");
  if(flt!=="الكل"&&!D.types.some(function(t){return t[0]===flt}))flt="الكل";
  $("filt").innerHTML=["الكل"].concat(D.types.map(function(t){return t[0]})).map(function(t){return '<button class="f'+(t===flt?' on':'')+'" data-a="flt" data-v="'+esc(t)+'">'+esc(t)+'</button>'}).join("");
  var l=all.filter(function(i){return flt==="الكل"||i.type===flt});
  $("list").innerHTML=l.length?l.map(function(i){var k="i:"+i.id,b=bal(i),n=i.entries.length,m="";
    if(n>1){var le=i.entries[n-1],p=pct(b-le.v,le.v);m=' • <b class="'+(le.v>=0?'up':'dn')+'">'+(le.v>=0?'↑ ':'↓ ')+(p===null?'':pcTxt(p).replace(/^[+-]/,''))+'</b>'}
    var sh=tot>0&&rev[k]&&b>0?' • '+Math.round(b/tot*100)+'%':'';
    return '<div class="row'+(selMode&&SEL[i.id]?' sel':'')+'" data-id="'+i.id+'">'+(selMode?'<div class="chk'+(SEL[i.id]?' on':'')+'">'+(SEL[i.id]?'✓':'')+'</div>':'')+'<span class="dot" style="background:'+cl(i.type)+';margin:0"></span><div class="nm">'+esc(i.name)+'<i>'+esc(i.type)+sh+m+'</i></div><div class="am">'+V(k,b)+'</div>'+E(k)+(selMode?'':'<button class="pls" data-a="add" data-id="'+i.id+'" aria-label="إضافة مبلغ">＋</button>')+'</div>'}).join(""):'<div class="emp">مفيش بنود — اضغط «بند جديد»</div>';
  $("flt").textContent=flt==="الكل"?"إجمالي المعروض":"إجمالي "+flt;
  $("ftot").innerHTML=(rev.total?fmt(sum(l)):"••••");
  var any=Object.keys(rev).length>0;$("all").textContent=any?"🙈 إخفاء":"👁 الكل";
  var n=Object.keys(SEL).length;$("selbar").style.display=selMode?"flex":"none";$("fab").style.display=selMode?"none":"";
  $("selc").textContent="محدد: "+n;
}
function toast(m,u){$("tm").textContent=m;$("un").style.display=u?"":"none";if(!u)undo=null;$("ts").style.display="flex";clearTimeout(tt);tt=setTimeout(function(){$("ts").style.display="none";undo=null},u?7000:3500)}
function open(h){$("sh").innerHTML=h;$("ov").style.display="flex"}
function close(){$("ov").style.display="none"}
function find(id){return D.items.filter(function(x){return x.id===+id})[0]}

/* ---- بند جديد / تعديل ---- */
function tys(){$("ty").innerHTML=D.types.map(function(t){return '<button class="t'+(t[0]===selT?' on':'')+'" data-a="st" data-v="'+esc(t[0])+'">'+esc(t[0])+'</button>'}).join("")}
function form(it){
  selT=it?it.type:(flt!=="الكل"?flt:D.types[0][0]);editId=it?it.id:null;
  open('<h2>'+(it?'تعديل البند':'بند جديد')+'</h2><label>اسم البند</label><input class="in" id="nm" autocomplete="off" placeholder="مثال: إيجار" value="'+(it?esc(it.name):'')+'">'+(it?'':'<label>المبلغ الحالي (اختياري)</label><input class="in amt" id="am" inputmode="decimal" autocomplete="off" placeholder="0">')+'<label>النوع</label><div class="ty" id="ty"></div><div class="er" id="er"></div><button class="go" data-a="svitem">'+(it?'حفظ':'إضافة')+'</button><button class="go gr s" data-a="cn">إلغاء</button>');
  tys();setTimeout(function(){$("nm").focus()},150);
}
function saveItem(){
  var n=$("nm").value.trim();
  if(!n){$("er").textContent="اكتب اسم البند";$("nm").focus();return}
  if(editId){var it=find(editId);it.name=n;it.type=selT;save();close();render();toast("تم الحفظ ✓",false);if(fromDet)detail(editId);return}
  var a=$("am")?calc($("am").value):0;if(a===null){$("er").textContent="المبلغ غير صحيح";return}
  var id=uid(),e=[];if(a)e.push({id:uid(),v:a,ts:Date.now(),n:"رصيد افتتاحي"});
  D.items.push({id:id,name:n,type:selT,entries:e});rev["i:"+id]=true;save();close();render();toast("تمت إضافة البند ✓",false);
}

/* ---- إضافة مبلغ على بند ---- */
function openAdd(id,fd){
  var it=find(id);if(!it)return;addId=it.id;addMode="add";fromDet=!!fd;
  open('<h2>'+esc(it.name)+'</h2><div class="sub">الرصيد الحالي: <span dir="ltr">'+fmt(bal(it))+'</span> جنيه</div>'+
  '<div class="seg"><button class="t on" data-a="mode" data-v="add">＋ إضافة</button><button class="t" data-a="mode" data-v="sub">− خصم</button><button class="t" data-a="mode" data-v="set">= ضبط الرصيد</button></div>'+
  '<label id="al">المبلغ (تقدر تكتب عملية مثل 500+250)</label><input class="in amt" id="ad" inputmode="decimal" autocomplete="off" placeholder="0">'+
  '<div class="ops"><button data-a="op" data-v="+">+</button><button data-a="op" data-v="-">−</button><button data-a="op" data-v="*">×</button><button data-a="op" data-v="/">÷</button></div>'+
  '<label>ملاحظة (اختياري)</label><input class="in" id="ntx" autocomplete="off" style="font-size:16px">'+
  '<div class="pv" id="pv">اكتب المبلغ</div><div class="er" id="er"></div><button class="go" data-a="svadd">حفظ</button><button class="go gr s" data-a="cn">إلغاء</button>');
  setTimeout(function(){$("ad").focus()},150);
}
function addVal(){
  var it=find(addId),x=calc($("ad").value);if(x===null||!it)return null;
  var b=bal(it);
  if(addMode==="sub")return -Math.abs(x);
  if(addMode==="set")return r2(x-b);
  return x;
}
function pv(){
  var it=find(addId);if(!it||!$("pv"))return;var raw=$("ad").value.trim();
  if(!raw){$("pv").innerHTML="اكتب المبلغ";return}
  var v=addVal();if(v===null){$("pv").innerHTML='<span class="dn">اكتب رقم أو عملية صحيحة</span>';return}
  var b=bal(it),p=pct(b,v);
  $("pv").innerHTML='الرصيد بعد الحفظ: <span dir="ltr">'+fmt(r2(b+v))+'</span><small>'+(v===0?'لا تغيير':'الحركة: <span dir="ltr">'+sg(v)+'</span>'+(p!==null?' • <span class="'+(v>=0?'up':'dn')+'" dir="ltr">'+pcTxt(p)+'</span> من الرقم القديم':''))+'</small>';
}
function saveAdd(){
  var it=find(addId),v=addVal();
  if(v===null){$("er").textContent="اكتب رقم أو عملية صحيحة";$("ad").focus();return}
  if(v===0){$("er").textContent="لا يوجد تغيير في الرصيد";return}
  var b=bal(it),p=pct(b,v),note=$("ntx").value.trim()||(addMode==="set"?"ضبط الرصيد":"");
  it.entries.push({id:uid(),v:v,ts:Date.now(),n:note});rev["i:"+it.id]=true;save();close();render();
  toast("تم ✓ "+sg(v)+(p!==null?" ("+pcTxt(p)+" من القديم)":""),false);
  if(fromDet)detail(it.id);
}

/* ---- سجل البند ---- */
function detail(id){
  var it=find(id);if(!it)return;var run=0,rows=[];
  it.entries.forEach(function(e,i){var p=i===0?null:pct(run,e.v);run=r2(run+e.v);rows.push({e:e,p:p,after:run,first:i===0})});
  var h=rows.slice().reverse().map(function(r){
    var e=r.e;return '<div class="hs"><div class="a"><b>'+(e.n?esc(e.n):(r.first?'أول رصيد':(e.v>=0?'إضافة':'خصم')))+'</b><i>'+dt(e.ts)+' • '+tm(e.ts)+' • الرصيد بعده '+fmt(r.after)+'</i></div><div><div class="v '+(e.v>=0?'up':'dn')+'">'+sg(e.v)+'</div>'+(r.p!==null?'<div class="p '+(e.v>=0?'up':'dn')+'">'+pcTxt(r.p)+' من القديم</div>':'')+'</div><button data-a="dele" data-id="'+it.id+'" data-v="'+e.id+'" aria-label="حذف الحركة">✕</button></div>'}).join("");
  open('<h2>'+esc(it.name)+'</h2><div class="sub">'+esc(it.type)+' • الرصيد الحالي</div><div class="big" style="font-size:38px">'+fmt(bal(it))+'</div>'+
  '<button class="go" data-a="addd" data-id="'+it.id+'">＋ إضافة مبلغ</button>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="go gr s" data-a="edit" data-id="'+it.id+'">✏️ الاسم / النوع</button><button class="go gr s" data-a="exone" data-id="'+it.id+'">📤 مشاركة</button></div>'+
  '<label>سجل الحركات ('+it.entries.length+')</label>'+(h||'<div class="emp">لا توجد حركات</div>')+
  '<button class="dl" data-a="deli" data-id="'+it.id+'">🗑 مسح البند</button><button class="go gr s" data-a="cn">إغلاق</button>');
}
function delEntry(iid,eid){
  var it=find(iid);if(!it)return;var k=it.entries.findIndex(function(e){return e.id===+eid});if(k<0)return;
  var e=it.entries.splice(k,1)[0];save();render();detail(iid);
  toast("تم حذف الحركة",true);undo=function(){it.entries.splice(k,0,e);save();render()};
}
function delItem(id){
  var i=D.items.findIndex(function(x){return x.id===+id});if(i<0)return;var it=D.items.splice(i,1)[0];delete SEL[it.id];save();close();render();
  toast("تم مسح «"+it.name+"»",true);undo=function(){D.items.splice(i,0,it);save();render()};
}

/* ---- التصدير للواتساب (بدون نسب) ---- */
function expText(list){
  var tot=sum(list),g=[],t="📊 حسابات أحمد\n📅 "+dt(Date.now())+"\n━━━━━━━━━━\n";
  var used=D.types.filter(function(ty){return list.some(function(i){return i.type===ty[0]})});
  used.forEach(function(ty){
    var l=list.filter(function(i){return i.type===ty[0]});
    if(used.length>1)t+="\n【 "+ty[0]+" 】\n";else t+="\n";
    l.forEach(function(i){t+="▪ "+i.name+": "+fmt(bal(i))+"\n"});
    if(used.length>1&&l.length>1)t+="المجموع: "+fmt(sum(l))+"\n";
  });
  return t+"\n━━━━━━━━━━\n💰 الإجمالي: "+fmt(tot)+" جنيه";
}
function expOpen(list,title){
  if(!list.length){toast("لا توجد بنود للتصدير",false);return}
  expList=list;
  open('<h2>📤 '+esc(title)+'</h2><div class="sub">بدون نسب مئوية • '+list.length+' بند</div><div class="pre" id="pre">'+esc(expText(list))+'</div><button class="go wa" data-a="wa">إرسال على واتساب</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="go gr s" data-a="cp">📋 نسخ</button><button class="go gr s" data-a="sh">مشاركة…</button></div><button class="go gr s" data-a="cn">إغلاق</button>');
}
function expMenu(){
  open('<h2>📤 تصدير</h2><button class="go" data-a="exall">كل البنود ('+D.items.length+')</button>'+(flt!=="الكل"?'<button class="go gr" data-a="exflt">بنود «'+esc(flt)+'» فقط</button>':'')+'<button class="go gr" data-a="exsel">اختيار بنود معينة</button><button class="go gr s" data-a="cn">إلغاء</button>');
}

/* ---- الإعدادات والأنواع ---- */
function settings(){open('<h2>الإعدادات</h2><button class="go gr" data-a="tmg">🏷 إدارة الأنواع</button><button class="go gr" data-a="bk">⬇ حفظ نسخة احتياطية</button><button class="go gr" data-a="rs">⬆ استرجاع نسخة</button><button class="go gr" data-a="pin">🔒 '+(D.pin?'تغيير الرمز':'تعيين رمز للقفل')+'</button>'+(D.pin?'<button class="go gr" data-a="nopin">🔓 إلغاء الرمز</button>':'')+'<button class="go" data-a="cn">تم</button>')}
function tmg(){
  open('<h2>إدارة الأنواع</h2><div class="sub">غيّر الاسم أو احذف أو أضف نوع جديد</div>'+D.types.map(function(t,i){return '<div class="tr"><span class="dot" style="background:'+t[1]+';margin:0"></span><input class="in" data-ti="'+i+'" value="'+esc(t[0])+'"><button data-a="delty" data-id="'+i+'">🗑</button></div>'}).join("")+'<div class="er" id="er"></div><button class="go gr s" data-a="addty">＋ نوع جديد</button><button class="go" data-a="svty">حفظ</button><button class="go gr s" data-a="cn">إلغاء</button>');
}
function applyTy(){
  var ins=document.querySelectorAll("[data-ti]"),seen={},map=[];
  for(var k=0;k<ins.length;k++){var i=+ins[k].dataset.ti,nn=ins[k].value.trim()||D.types[i][0];if(seen[nn])return "الأسماء لازم تكون مختلفة";seen[nn]=1;map.push([D.types[i][0],nn])}
  map.forEach(function(m,i){if(m[0]!==m[1]){D.items.forEach(function(it){if(it.type===m[0])it.type=m[1]});if(flt===m[0])flt=m[1];D.types[i][0]=m[1]}});
  return "";
}
function backup(){var b=new Blob([JSON.stringify({v:4,items:D.items,types:D.types})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hisabat-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();toast("تم حفظ النسخة ✓",false)}

/* ---- القفل ---- */
function lock(m,skip){P.m=m;P.b="";P.f="";P.skip=!!skip;pinUI();$("lk").style.display="flex"}
function pinUI(){
  var t={unlock:"اكتب الرمز",s1:"اختر رمز من 4 أرقام",s2:"أعد كتابة الرمز"}[P.m];
  $("lt").textContent=t;$("dots").innerHTML=[0,1,2,3].map(function(i){return '<b class="'+(i<P.b.length?'on':'')+'"></b>'}).join("");
  $("pad").innerHTML=[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(function(k){return k===""?'<span></span>':'<button data-k="'+k+'">'+k+'</button>'}).join("");
  $("lsk").style.display=P.skip?"":"none";$("lsk").textContent=D.pin&&P.m!=="unlock"?"إلغاء":"تخطي";$("lfg").style.display=P.m==="unlock"?"":"none";
}
function key(k){
  $("le").textContent="";
  if(k==="⌫")P.b=P.b.slice(0,-1);else if(P.b.length<4)P.b+=k;
  pinUI();if(P.b.length<4)return;
  setTimeout(function(){
    if(P.m==="unlock"){if(hash(P.b)===D.pin){$("lk").style.display="none"}else{P.b="";pinUI();$("le").textContent="الرمز غلط، جرّب تاني"}}
    else if(P.m==="s1"){P.f=P.b;P.b="";P.m="s2";pinUI()}
    else{if(P.b===P.f){D.pin=hash(P.b);var a=new Uint32Array(1),c;try{crypto.getRandomValues(a);c=String(10000000+a[0]%90000000)}catch(x){c=String(10000000+Math.floor(Math.random()*90000000))}D.rec=hash(c);save();$("lk").style.display="none";open('<h2>🔑 كود الاسترجاع</h2><div class="big" style="text-align:center;letter-spacing:4px">'+c+'</div><div class="hint">اكتبه في مكان آمن أو صوّر الشاشة. لو نسيت الرمز هتحتاجه، ومش هيظهر تاني.</div><button class="go" data-a="cn">حفظته ✓</button>')}else{P.b="";P.f="";P.m="s1";pinUI();$("le").textContent="الرمزين مش متطابقين، ابدأ تاني"}}
  },120);
}

/* ---- الأحداث ---- */
function act(a,d){
  var id=d.dataset.id,v=d.dataset.v;
  switch(a){
    case "flt":flt=v;render();break;
    case "new":fromDet=false;form(null);break;
    case "add":openAdd(id,false);break;
    case "addd":openAdd(id,true);break;
    case "mode":addMode=v;var bs=document.querySelectorAll('[data-a="mode"]');for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].dataset.v===v);
      $("al").textContent=v==="set"?"الرصيد الجديد (الرقم اللي عايزه يبقى في البند)":"المبلغ (تقدر تكتب عملية مثل 500+250)";pv();break;
    case "op":var inp=$("ad");inp.value+=v;inp.focus();pv();break;
    case "svadd":saveAdd();break;
    case "edit":fromDet=true;form(find(id));break;
    case "svitem":saveItem();break;
    case "st":selT=v;tys();break;
    case "deli":var it=find(id);open('<h2>مسح «'+esc(it.name)+'»؟</h2><div class="sub">هيتم مسح البند وكل سجله (تقدر تتراجع لمدة ثواني)</div><button class="go red" data-a="yd" data-id="'+id+'">نعم، امسح</button><button class="go gr" data-a="cn">إلغاء</button>');break;
    case "yd":delItem(id);break;
    case "dele":delEntry(id,v);break;
    case "cn":close();break;
    case "exp":expMenu();break;
    case "exall":expOpen(D.items.slice(),"كل البنود");break;
    case "exflt":expOpen(D.items.filter(function(i){return i.type===flt}),"بنود "+flt);break;
    case "exsel":close();selMode=true;SEL={};render();toast("اختار البنود ثم اضغط واتساب",false);break;
    case "exone":expOpen([find(id)],find(id).name);break;
    case "selgo":expOpen(D.items.filter(function(i){return SEL[i.id]}),"البنود المحددة");break;
    case "selx":selMode=false;SEL={};render();break;
    case "wa":window.open("https://wa.me/?text="+encodeURIComponent(expText(expList)),"_blank");break;
    case "cp":copy(expText(expList));break;
    case "sh":if(navigator.share){navigator.share({text:expText(expList)}).catch(function(){})}else copy(expText(expList));break;
    case "set":settings();break;
    case "bk":backup();break;
    case "rs":$("fi").click();break;
    case "pin":close();lock("s1",true);break;
    case "nopin":D.pin=null;D.rec=null;save();settings();toast("تم إلغاء الرمز",false);break;
    case "yes-rs":close();if(window._rs){D.items=window._rs.items;if(window._rs.types)D.types=window._rs.types;fixTypes();SEL={};selMode=false;save();render();toast("تم الاسترجاع ✓",false)}break;
    case "tmg":tmg();break;
    case "addty":var e1=applyTy();D.types.push(["نوع "+(D.types.length+1),PAL[D.types.length%PAL.length]]);save();tmg();break;
    case "delty":var e2=applyTy(),ix=+id;if(D.types.length<2){$("er").textContent="لازم يفضل نوع واحد على الأقل";break}
      var gone=D.types.splice(ix,1)[0][0],to=D.types[0][0];D.items.forEach(function(i){if(i.type===gone)i.type=to});save();render();tmg();break;
    case "svty":var er=applyTy();if(er){$("er").textContent=er;break}save();close();render();toast("تم الحفظ ✓",false);break;
  }
}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("تم النسخ ✓",false)},function(){selPre()})}else selPre();
}
function selPre(){var p=$("pre");if(p){var r=document.createRange();r.selectNodeContents(p);var s=getSelection();s.removeAllRanges();s.addRange(r);toast("حدّد النص وانسخه",false)}}
document.addEventListener("click",function(e){
  var el=e.target,d;
  if(d=el.closest("[data-eye]")){var k=d.dataset.eye;if(rev[k])delete rev[k];else rev[k]=true;render();return}
  if(d=el.closest("[data-k]")){key(d.dataset.k);return}
  if(d=el.closest("[data-a]")){act(d.dataset.a,d);return}
  if(d=el.closest(".row")){var id=+d.dataset.id;if(selMode){if(SEL[id])delete SEL[id];else SEL[id]=true;render()}else{fromDet=true;detail(id)}return}
  if(el.id==="ov")close();
  else if(el.id==="all"){if(Object.keys(rev).length)rev={};else{rev={total:true};D.types.forEach(function(t){rev["ty:"+t[0]]=true});D.items.forEach(function(i){rev["i:"+i.id]=true})}render()}
  else if(el.id==="un"){if(undo){undo();undo=null}$("ts").style.display="none"}
  else if(el.id==="lsk")$("lk").style.display="none";
  else if(el.id==="lfg")open('<h2>استرجاع الرمز</h2><label>اكتب كود الاسترجاع (8 أرقام)</label><input class="in amt" id="rc" inputmode="numeric" maxlength="8" autocomplete="off"><div class="er" id="rer"></div><button class="go" id="rok">تأكيد</button><button class="go gr" data-a="cn">إلغاء</button>');
  else if(el.id==="rok"){var v=digits($("rc").value).trim();if(D.rec&&hash(v)===D.rec){D.pin=null;D.rec=null;save();close();lock("s1",true)}else $("rer").textContent=D.rec?"الكود غلط":"مفيش كود استرجاع محفوظ"}
});
document.addEventListener("input",function(e){if(e.target.id==="ad")pv()});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&$("ov").style.display==="flex"){if($("ad"))saveAdd();else if($("nm")&&$("nm").value!==undefined&&document.querySelector('[data-a="svitem"]'))saveItem()}});
$("fi").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.items))throw 0;
  window._rs={items:o.items.map(mig),types:(o.types&&o.types.length)?o.types:null};
  open('<h2>هيتم استبدال البنود الحالية. متأكد؟</h2><button class="go red" data-a="yes-rs">نعم، استرجع</button><button class="go gr" data-a="cn">إلغاء</button>')}catch(e){toast("الملف غير صالح",false)}};r.readAsText(f);this.value=""};
document.addEventListener("visibilitychange",function(){if(document.hidden){rev={};render();if(D.pin&&$("lk").style.display!=="flex")lock("unlock",false)}});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
if(D.pin)lock("unlock",false);else if(!D.asked){D.asked=true;save();lock("s1",true)}
</script></body></html>
