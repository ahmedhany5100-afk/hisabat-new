<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABO HANY CAPTAIN</title>
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ABO HANY">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1F4E79"><meta name="color-scheme" content="light">
<style>
:root{--pr:#1F4E79;--bg:#F1F5F9;--tx:#0F172A;--mu:#64748B;--bd:#E2E8F0;--ok:#047857;--rd:#DC2626;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:17px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top img{width:44px;height:44px;border-radius:12px}
.top h1{font-size:18px;margin:0;line-height:1.2}
#st{font-size:12px;color:var(--mu);margin-top:2px}
.sp{flex:1}
.ic{background:#fff;border:1px solid var(--bd);border-radius:12px;min-width:44px;height:44px;font-size:20px}
.tot{background:linear-gradient(135deg,#1F4E79,#2F6DA8);color:#fff;border-radius:22px;padding:18px;margin-bottom:16px}
.tot .l{display:flex;justify-content:space-between;align-items:center;font-size:15px;opacity:.9}
.tot .v{font-size:36px;font-weight:800;margin:8px 0 2px;direction:ltr;text-align:right}
.tot small{font-size:16px;font-weight:400}
.tot .ic{background:rgba(255,255,255,.18);border:0;height:38px;min-width:38px;font-size:17px}
.pc{font-size:13px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block}
.up{background:#DCFCE7;color:#166534}.dn{background:#FEE2E2;color:#991B1B}
.side{background:#fff;border-radius:20px;border-right:6px solid var(--c);margin-bottom:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.sh{display:flex;align-items:center;gap:6px}
.sn{font-weight:800;font-size:18px;flex:1;color:var(--c);padding:6px 0}
.sh .ic{height:38px;min-width:38px;font-size:16px;border-radius:10px}
.st{font-size:24px;font-weight:800;direction:ltr;text-align:right;margin:2px 0 6px}
.st small{font-size:14px;font-weight:400;color:var(--mu)}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.in1{flex:1;min-width:0}
.nm{font-weight:600;padding:2px 0}
.bl{font-size:19px;font-weight:700;direction:ltr;text-align:right}
.mask{letter-spacing:3px;color:var(--mu)}
.plus{background:var(--c);color:#fff;width:46px;height:46px;border-radius:50%;font-size:26px;line-height:1}
.addi{width:100%;margin-top:8px;background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:12px;padding:10px;color:var(--mu)}
.emp{color:var(--mu);font-size:14px;padding:8px 0}
.newside{width:100%;background:transparent;border:2px dashed #CBD5E1;border-radius:16px;padding:14px;color:var(--mu);font-weight:600}
#fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pr);color:#fff;border-radius:40px;padding:16px 30px;font-size:19px;font-weight:700;box-shadow:0 6px 18px rgba(31,78,121,.4);z-index:5}
#ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;z-index:20}
#sb{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#sb h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
.in,select{width:100%;border:1.5px solid var(--bd);border-radius:14px;padding:13px;background:#fff;font-size:17px}
.big{font-size:30px;font-weight:700;text-align:center;direction:ltr}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;padding:12px;border-radius:12px;background:#F1F5F9;font-weight:700}
.seg .on{background:var(--pr);color:#fff}
.go{width:100%;background:var(--pr);color:#fff;border-radius:14px;padding:15px;font-weight:700;font-size:18px;margin-top:14px}
.gr{background:#E2E8F0;color:var(--tx)}.rd{background:#FEE2E2;color:#991B1B}.wa{background:#16A34A}
.row2{display:flex;gap:8px}.row2 .go{margin-top:10px}
.er{color:var(--rd);font-size:14px;min-height:18px;margin-top:6px}
.en{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd);font-size:15px}
.en .d{color:var(--mu);font-size:13px;min-width:44px}.en .n{flex:1;color:var(--mu);font-size:13px}
.en b{direction:ltr}.en button{background:none;font-size:18px;color:var(--rd)}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--bd)}
.sw .on{box-shadow:0 0 0 3px var(--tx)}
#tst{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:11px 18px;border-radius:30px;font-size:15px;display:none;z-index:40;max-width:90%;text-align:center}
.full{position:fixed;inset:0;background:linear-gradient(160deg,#1F4E79,#143552);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;text-align:center}
.full img{width:84px;height:84px;border-radius:22px;margin-bottom:10px}
#lm{font-size:19px;margin:6px 0 14px;min-height:28px}
#dots{display:flex;gap:16px;margin-bottom:22px;direction:ltr}
#dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}
#dots i.f{background:#fff}
#kp{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
#kp button{height:68px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:28px}
.lk{background:none;color:#BFD6EE;margin-top:18px;font-size:15px;text-decoration:underline}
#login .in{max-width:340px;margin:6px 0;direction:ltr;color:var(--tx)}
#login .go{max-width:340px;background:#fff;color:var(--pr)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style></head><body>

<div id="lock" class="full"><img src="icon-192.png" alt=""><div id="lm">جاري التحميل…</div><div id="dots"><i></i><i></i><i></i><i></i></div><div id="kp"></div><button class="lk" id="fg" data-a="forgot" style="display:none">نسيت الرمز؟</button><button class="lk" id="cx" data-a="cancelPin" style="display:none">إلغاء</button></div>

<div id="login" class="full"><img src="icon-192.png" alt=""><h2>تسجيل الدخول</h2><div style="opacity:.85;margin-bottom:10px;font-size:15px">مرة واحدة بس، وبعدها بيفتح لوحده</div><input class="in" id="em" type="email" placeholder="الإيميل" autocomplete="email"><input class="in" id="pw" type="password" placeholder="الباسورد" autocomplete="current-password"><div class="er" id="le" style="color:#FCA5A5"></div><button class="go" data-a="login">دخول</button></div>

<div id="app">
  <div class="top"><img src="icon-192.png" alt=""><div><h1>ABO HANY CAPTAIN</h1><div id="st">…</div></div><div class="sp"></div><button class="ic" data-a="eyeAll" id="ea">👁</button><button class="ic" data-a="gear">⚙</button></div>
  <div class="tot"><div class="l"><span>الإجمالي</span><span><button class="ic" data-a="shareAll">📤</button> <button class="ic" data-a="eyeTot" id="et">👁</button></span></div><div class="v" id="tv"></div><div id="tp"></div></div>
  <div id="sides"></div>
  <button class="newside" data-a="newSide">＋ جانب جديد</button>
</div>
<button id="fab" data-a="addAny">＋ إضافة مبلغ</button>
<div id="ov"><div id="sb"></div></div>
<div id="tst"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
var COL=["#1F4E79","#D97706","#047857","#7C3AED","#BE185D","#0E7490"];
var DEF=[["شغل",COL[0]],["شغل جانبي",COL[1]],["بيت",COL[2]],["عيال",COL[3]]];
var D={items:[],types:[],pin2:null},CL={},user=null,ref=null,unsub=null,loaded=false,unlocked=false,lockShown=false;
var pinMode="enter",pinBuf="",pinTmp="",shown={},hiddenAt=0,uidn=0,ctx={},lastMeta=null,lastType="";
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now()*100+(uidn++%100)}
function r2(n){return Math.round(n*100)/100}
function fmt(n){return Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2})}
function bal(it){return it.entries.reduce(function(a,e){return r2(a+e.v)},0)}
function sum(a){return a.reduce(function(s,i){return r2(s+bal(i))},0)}
function ofType(n){return D.items.filter(function(i){return i.type===n})}
function find(id){return D.items.filter(function(i){return String(i.id)===String(id)})[0]}
function dt(ts){var d=new Date(ts);return d.getDate()+"/"+(d.getMonth()+1)}
function toast(m){var t=$("tst");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none"},2200)}
function hash(s){var x=5381;s="ab"+s+"cd";for(var i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return ""+x}
function vis(k){return !!shown[k]}
function num(k,v){return vis(k)?'<b dir="ltr">'+fmt(v)+'</b>':'<b class="mask">••••</b>'}
function pct(items){var b=null;items.forEach(function(it){it.entries.forEach(function(e){if(!b||e.ts>b.ts||(e.ts===b.ts&&e.id>b.id))b=e})});if(!b)return null;var prev=r2(sum(items)-b.v);if(!prev)return null;return b.v/Math.abs(prev)*100}
function pctH(k,items){if(!vis(k))return "";var p=pct(items);if(p===null||!isFinite(p))return "";var up=p>=0;return '<span class="pc '+(up?"up":"dn")+'" dir="ltr">'+(up?"▲ ":"▼ ")+Math.abs(Math.round(p*10)/10)+"%</span>"}
function calc(s){s=String(s||"").replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/٫/g,".").replace(/[,،\s]/g,"");if(!/^[\d.+\-]+$/.test(s))return null;var m=s.match(/[+-]?\d*\.?\d+/g);if(!m)return null;var t=0;m.forEach(function(x){t+=parseFloat(x)});t=Math.abs(r2(t));return t>0?t:null}

/* ---------- العرض ---------- */
function render(){
  $("tv").innerHTML=num("tot",sum(D.items))+" <small>جنيه</small>";
  $("tp").innerHTML=pctH("tot",D.items);
  $("et").textContent=vis("tot")?"🙈":"👁";
  var h="";
  D.types.forEach(function(t,ti){
    var its=ofType(t[0]),k="t:"+t[0];
    h+='<section class="side" style="--c:'+t[1]+'"><div class="sh"><div class="sn" data-a="editSide" data-v="'+ti+'">'+esc(t[0])+' ✎</div><button class="ic" data-a="shareSide" data-v="'+ti+'">📤</button><button class="ic" data-a="eyeSide" data-v="'+ti+'">'+(vis(k)?"🙈":"👁")+'</button></div>';
    h+='<div class="st">'+num(k,sum(its))+' <small>جنيه</small></div><div>'+pctH(k,its)+'</div>';
    if(!its.length)h+='<div class="emp">مفيش بنود هنا</div>';
    its.forEach(function(it){
      var ik="i:"+it.id;
      h+='<div class="it"><div class="in1"><div class="nm" data-a="openItem" data-v="'+it.id+'">'+esc(it.name)+'</div><div class="bl">'+num(ik,bal(it))+" "+pctH(ik,[it])+'</div></div><button class="ic" data-a="eyeItem" data-v="'+it.id+'">'+(vis(ik)?"🙈":"👁")+'</button><button class="plus" data-a="addItem" data-v="'+it.id+'">＋</button></div>';
    });
    h+='<button class="addi" data-a="newItem" data-v="'+ti+'">＋ بند جديد في '+esc(t[0])+'</button></section>';
  });
  $("sides").innerHTML=h;
}
function setStatus(){
  var s=lastMeta,t="…";
  if(!user)t="🔒 غير مسجل";
  else if(!s)t=navigator.onLine?"⏳ جاري التحميل…":"📴 أوفلاين";
  else if(s.hasPendingWrites)t=navigator.onLine?"⏳ جاري الحفظ…":"📴 محفوظ على الجهاز، هيترفع لما النت يرجع";
  else t=navigator.onLine?"✅ تم الحفظ":"📴 أوفلاين، كل بياناتك محفوظة";
  $("st").textContent=t;
}
window.addEventListener("online",setStatus);window.addEventListener("offline",setStatus);

/* ---------- الحفظ ---------- */
function save(){
  render();
  if(!ref||!loaded)return;
  D.updatedAt=Date.now();
  ref.set(Object.assign({},CL,{items:D.items,types:D.types,pin2:D.pin2,updatedAt:D.updatedAt})).catch(function(e){
    console.error(e);$("st").textContent="⚠ تعذر الحفظ، حاول تاني";
  });
}
function ensureTypes(){
  if(!D.types||!D.types.length)D.types=DEF.map(function(t){return t.slice()});
  D.items.forEach(function(i){
    if(!D.types.some(function(t){return t[0]===i.type}))D.types.push([i.type||"أخرى",COL[D.types.length%COL.length]]);
    if(!i.entries)i.entries=[];
  });
}

/* ---------- القفل ---------- */
var MSG={enter:"اكتب الرمز",create1:"اعمل رمز من 4 أرقام",create2:"اكتب الرمز تاني للتأكيد"};
function showLock(mode,canCancel){
  pinMode=mode;pinBuf="";lockShown=true;
  $("lock").style.display="flex";$("lm").textContent=MSG[mode];
  $("fg").style.display=mode==="enter"?"block":"none";
  $("cx").style.display=canCancel?"block":"none";
  dots();
}
function dots(){var d=$("dots").children;for(var i=0;i<4;i++)d[i].className=i<pinBuf.length?"f":""}
function buildKp(){
  var h="";[1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button data-a="k" data-v="'+n+'">'+n+"</button>"});
  h+='<span></span><button data-a="k" data-v="0">0</button><button data-a="k" data-v="x">⌫</button>';$("kp").innerHTML=h;
}
function keyIn(v){
  if(!loaded)return;
  if(v==="x")pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=v;
  dots();if(pinBuf.length===4)setTimeout(pinDone,120);
}
function bad(m){$("lm").textContent=m;$("dots").classList.remove("shake");void $("dots").offsetWidth;$("dots").classList.add("shake");pinBuf="";dots()}
function pinDone(){
  if(pinMode==="enter"){
    if(hash(pinBuf)===D.pin2)unlock();else bad("الرمز غلط، جرّب تاني");
  }else if(pinMode==="create1"){pinTmp=pinBuf;pinBuf="";pinMode="create2";$("lm").textContent=MSG.create2;dots()}
  else{
    if(pinBuf===pinTmp){D.pin2=hash(pinBuf);save();unlock();toast("تم حفظ الرمز ✓")}
    else{pinMode="create1";bad("مش متطابق، ابدأ من الأول")}
  }
}
function unlock(){unlocked=true;$("lock").style.display="none";pinBuf="";render()}
document.addEventListener("visibilitychange",function(){
  if(document.hidden)hiddenAt=Date.now();
  else if(unlocked&&D.pin2&&Date.now()-hiddenAt>60000){unlocked=false;showLock("enter")}
});

/* ---------- النوافذ ---------- */
function sheet(h){$("sb").innerHTML=h;$("ov").style.display="flex"}
function closeS(){$("ov").style.display="none";$("sb").innerHTML=""}
$("ov").addEventListener("click",function(e){if(e.target===$("ov"))closeS()});
function typeOpts(sel){return D.types.map(function(t,i){return '<option value="'+esc(t[0])+'"'+(t[0]===sel?" selected":"")+">"+esc(t[0])+"</option>"}).join("")}
function fillItems(){
  var ty=$("sd").value,its=ofType(ty),h="";
  its.forEach(function(i){h+='<option value="'+i.id+'">'+esc(i.name)+"</option>"});
  h+='<option value="__new">＋ بند جديد</option>';$("si").innerHTML=h;
  if(!its.length)$("si").value="__new";
  $("nn").style.display=$("si").value==="__new"?"block":"none";
}
function addSheet(itemId){
  var it=itemId?find(itemId):null;ctx={mode:"add",item:it?it.id:null};
  var h="<h2>"+(it?esc(it.name):"إضافة مبلغ")+'</h2><div class="seg"><button class="on" data-a="mode" data-v="add">＋ إضافة</button><button data-a="mode" data-v="sub">− خصم</button></div><input id="am" class="in big" inputmode="decimal" placeholder="المبلغ" autocomplete="off">';
  if(!it)h+='<label>فلوس إيه؟ (الجانب)</label><select id="sd" data-a="selS">'+typeOpts(lastType||D.types[0][0])+'</select><label>البند</label><select id="si" data-a="selI"></select><input id="nn" class="in" placeholder="اسم البند الجديد" style="margin-top:8px;display:none">';
  h+='<input id="nt" class="in" placeholder="ملاحظة (اختياري)" style="margin-top:12px"><div class="er" id="er"></div><button class="go" data-a="saveAdd">حفظ</button>';
  sheet(h);if(!it)fillItems();setTimeout(function(){$("am").focus()},200);
}
function saveAdd(){
  var a=calc($("am").value);if(!a){$("er").textContent="اكتب مبلغ صحيح";return}
  var it;
  if(ctx.item)it=find(ctx.item);
  else{
    var ty=$("sd").value,sv=$("si").value;lastType=ty;
    if(sv==="__new"){var n=$("nn").value.trim();if(!n){$("er").textContent="اكتب اسم البند";return}it={id:uid(),name:n,type:ty,entries:[]};D.items.push(it)}
    else it=find(sv);
  }
  var note=$("nt").value.trim();
  it.entries.push({id:uid(),v:ctx.mode==="sub"?-a:a,ts:Date.now(),n:note});
  shown["i:"+it.id]=true;save();closeS();toast("تمت الإضافة ✓");
}
function itemSheet(id){
  var it=find(id);if(!it)return;var k="i:"+it.id,v=vis(k);ctx={item:it.id};
  var h='<div class="row2"><h2 style="flex:1">'+esc(it.name)+'</h2><button class="ic" data-a="eyeItemS" data-v="'+it.id+'">'+(v?"🙈":"👁")+"</button></div>";
  h+='<div style="font-size:26px;font-weight:800;direction:ltr;text-align:right">'+num(k,bal(it))+" <small>جنيه</small></div>";
  h+='<label>الاسم</label><input id="rn" class="in" value="'+esc(it.name)+'"><label>الجانب</label><select id="rt">'+typeOpts(it.type)+"</select>";
  h+='<label>آخر العمليات</label>';
  var es=it.entries.slice().reverse().slice(0,30);
  if(!es.length)h+='<div class="emp">لسه مفيش عمليات</div>';
  es.forEach(function(e){h+='<div class="en"><span class="d">'+dt(e.ts)+'</span><b style="color:'+(e.v>=0?"#047857":"#DC2626")+'">'+(v?(e.v>0?"+":"")+fmt(e.v):"••••")+'</b><span class="n">'+esc(e.n||"")+'</span><button data-a="delEn" data-v="'+e.id+'">✕</button></div>'});
  h+='<button class="go" data-a="saveItem">حفظ التعديل</button><div class="row2"><button class="go wa" data-a="shareItem">📤 واتساب</button><button class="go rd" data-a="delItem">حذف البند</button></div>';
  sheet(h);
}
function newItemSheet(ti){
  ctx={ti:ti};
  sheet('<h2>بند جديد في '+esc(D.types[ti][0])+'</h2><label>اسم البند</label><input id="nn2" class="in" placeholder="مثلًا: إيجار"><label>الرصيد الحالي (اختياري)</label><input id="op" class="in" inputmode="decimal" placeholder="0"><div class="er" id="er"></div><button class="go" data-a="saveNew">إضافة</button>');
  setTimeout(function(){$("nn2").focus()},200);
}
function sideSheet(ti){
  var t=ti===null?["",COL[D.types.length%COL.length]]:D.types[ti];ctx={ti:ti,col:t[1]};
  var h="<h2>"+(ti===null?"جانب جديد":"تعديل الجانب")+'</h2><label>الاسم</label><input id="sn" class="in" value="'+esc(t[0])+'" placeholder="مثلًا: شغل"><label>اللون</label><div class="sw">';
  COL.forEach(function(c){h+='<button data-a="col" data-v="'+c+'" style="background:'+c+'" class="'+(c===t[1]?"on":"")+'"></button>'});
  h+='</div><div class="er" id="er"></div><button class="go" data-a="saveSide">حفظ</button>';

  return s;
}
function tSide(t){var its=ofType(t[0]),s="📂 "+t[0]+" — الإجمالي: "+fmt(sum(its))+" جنيه";its.forEach(function(i){s+="\n• "+i.name+": "+fmt(bal(i))});return s}
function tAll(){var s="💰 الإجمالي: "+fmt(sum(D.items))+" جنيه";D.types.forEach(function(t){s+="\n\n"+tSide(t)});return s}
