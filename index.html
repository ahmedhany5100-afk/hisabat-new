<meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light">
<style>
:root{--bg:#fff;--tx:#111827;--mu:#6B7280;--bd:#E5E7EB;--pr:#1F4E79;--soft:#F3F6FA;--rd:#DC2626;--ok:#047857;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
button{cursor:pointer;font-weight:700}
.w{max-width:640px;margin:auto;padding:14px 16px 130px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
h1{font-size:22px;margin:0;color:var(--pr)}
.sm{border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:12px;padding:9px 11px;font-size:14px}
.tot{border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:12px}
.tot .l{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:16px;font-weight:700}
.big{font-size:46px;font-weight:800;line-height:1.25;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;color:var(--pr)}
.big small{font-size:18px;color:var(--mu);font-weight:700;margin-left:6px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sc{border:1px solid var(--bd);border-radius:16px;padding:12px}
.sc .t{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;color:var(--mu)}
.sc .v{font-size:22px;font-weight:800;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.sc i{font-style:normal;font-size:12px;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;flex:none}
.ey{border:0;background:var(--soft);border-radius:10px;font-size:16px;padding:5px 9px;color:var(--tx)}
.filt{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.f{flex:none;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:99px;padding:8px 16px;font-size:15px}
.f.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.row{display:flex;align-items:center;gap:10px;padding:14px 4px;border-top:1px solid var(--bd)}
.row.sel{background:var(--soft)}
.row .nm{flex:1;min-width:0;font-size:18px;font-weight:700;cursor:pointer}
.row .nm i{display:block;font-style:normal;font-size:13px;color:var(--mu);font-weight:600}
.row .nm b{font-size:12.5px;font-weight:700}
.row .am{font-size:22px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.pls{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:24px;line-height:1}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.chk.on{background:var(--pr);border-color:var(--pr)}
.ft{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--tx);padding-top:12px;margin-top:2px;font-weight:800;font-size:17px}
.ft div{font-size:26px;direction:ltr;color:var(--pr);font-variant-numeric:tabular-nums}
.emp{text-align:center;color:var(--mu);padding:30px 0}
.hint{text-align:center;color:var(--mu);font-size:13px;margin-top:10px}
.fab{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;border:0;border-radius:99px;padding:16px 24px;font-size:19px;box-shadow:0 6px 20px rgba(31,78,121,.3);z-index:5}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;border-radius:16px;padding:10px 12px;display:none;gap:8px;align-items:center;z-index:6;max-width:616px;margin:auto}
.selbar span{flex:1;font-weight:700;font-size:15px}
.selbar button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;background:#fff;color:#111827}
.selbar button.g{background:#25D366;color:#fff}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
.sh{background:#fff;width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sh h2{margin:0 0 6px;font-size:20px}
.sub{color:var(--mu);font-size:14px;font-weight:600;margin-bottom:4px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px;color:var(--mu)}
input.in{width:100%;font-size:20px;font-weight:700;padding:14px;border:2px solid var(--bd);border-radius:14px;background:#fff;color:var(--tx);outline:none}
input.in:focus{border-color:var(--pr)}
.amt{direction:ltr;text-align:right;font-size:30px!important;font-variant-numeric:tabular-nums}
.ty{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t{border:2px solid var(--bd);background:#fff;color:var(--tx);border-radius:12px;padding:11px 2px;font-size:15px}
.t.on{background:var(--pr);border-color:var(--pr);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;direction:ltr}
.ops button{border:1px solid var(--bd);background:var(--soft);border-radius:12px;padding:10px 0;font-size:22px;color:var(--tx)}
.pv{margin-top:12px;background:var(--soft);border-radius:14px;padding:12px;font-size:16px;font-weight:700;min-height:48px}
.pv small{display:block;color:var(--mu);font-weight:600;font-size:13px}
.up{color:var(--ok)}.dn{color:var(--rd)}
.go{width:100%;margin-top:14px;background:var(--pr);color:#fff;border:0;border-radius:14px;padding:16px;font-size:20px}
.go.red{background:var(--rd)}.go.gr{background:var(--soft);color:var(--tx)}.go.wa{background:#25D366}
.go.s{padding:13px;font-size:17px;margin-top:10px}
.dl{width:100%;margin-top:10px;background:#fff;color:var(--rd);border:1px solid var(--bd);border-radius:14px;padding:13px;font-size:16px}
.er{color:var(--rd);font-weight:700;font-size:14px;min-height:20px;margin-top:6px}
.hs{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--bd)}
.hs .a{flex:1;min-width:0}
.hs .a i{display:block;font-style:normal;font-size:12.5px;color:var(--mu);font-weight:600}
.hs .v{font-size:19px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.hs .p{font-size:12.5px;font-weight:700;direction:ltr;text-align:left}
.hs button{border:0;background:var(--soft);border-radius:8px;width:30px;height:30px;color:var(--mu)}
.pre{background:var(--soft);border-radius:14px;padding:12px;font-size:15px;white-space:pre-wrap;line-height:1.7;max-height:42vh;overflow:auto;user-select:text;-webkit-user-select:text}
.tr{display:flex;gap:8px;align-items:center;margin-top:8px}
.tr input{flex:1;font-size:17px!important;padding:11px!important}
.tr button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:10px 12px;color:var(--rd)}
.lk{position:fixed;inset:0;background:#fff;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lk h2{margin:0;font-size:22px;color:var(--pr)}
.dots{display:flex;gap:14px;direction:ltr}.dots b{width:18px;height:18px;border-radius:50%;border:2px solid var(--pr)}.dots b.on{background:var(--pr)}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:12px;direction:ltr}
.pad button{height:68px;border-radius:50%;border:1px solid var(--bd);background:var(--soft);font-size:26px;color:var(--tx)}
.pad button:active{background:var(--bd)}
.lk .lnk{border:0;background:none;color:var(--mu);font-size:15px;padding:8px}
.tst{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;display:none;gap:14px;align-items:center;z-index:45;max-width:92vw}
.tst button{background:none;border:0;color:#FBBF24;font-size:15px}

.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:46px;width:auto;border-radius:10px;object-fit:contain;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.08);background:#fff}
.brand-t{display:flex;flex-direction:column;gap:2px}
.brand-t b{font-size:17px;color:var(--pr);letter-spacing:.3px;line-height:1.2}
.sync{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ok);font-weight:700;width:fit-content}
.sync.off{color:#D97706}
.sync.err{color:var(--rd)}
.auth{position:fixed;inset:0;background:#fff;z-index:60;display:none;flex-direction:column;justify-content:center;padding:24px;max-width:440px;margin:auto}
.auth .alogo{width:96px;height:auto;margin:0 auto 12px;border-radius:16px;display:block}
.auth h2{color:var(--pr);margin:0 0 6px;font-size:22px;text-align:center}
.auth p{color:var(--mu);margin:0 0 14px;font-size:14px;line-height:1.6;text-align:center}
</style></head>

    case "bk":backup();break;
    case "rs":$("fi").click();break;
    case "pin":close();lock("s1",true);break;
    case "nopin":D.pin=null;D.rec=null;save();settings();toast("تم إلغاء الرمز",false);break;
    case "yes-rs":close();if(window._rs){D.items=window._rs.items;if(window._rs.types)D.types=window._rs.types;fixTypes();SEL={};selMode=false;save();render();toast("تم الاسترجاع ✓",false)}break;
    case "tmg":tmg();break;
    case "addty":var e1=applyTy();D.types.push(["نوع "+(D.types.length+1),PAL[D.types.length%PAL.length]]);save();tmg();break;
    case "delty":var e2=applyTy(),ix=+id;if(D.types.length<2){$("er").textContent="لازم يفضل نوع واحد على الأقل";break}
      var gone=D.types.splice(ix,1)[0][0],to=D.types[0][0];D.items.forEach(function(i){if(i.type===gone)i.type=to});save();render();tmg();break;
    case "svty":var er=applyTy();if(er){$("er").textContent=er;break}save();close();render();toast("تم الحفظ ✓",false);break;
    case "logout":if(window._fbLogout){close();window._fbLogout();}break;
  }
}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("تم النسخ ✓",false)},function(){selPre()})}else selPre();
}
function selPre(){var p=$("pre");if(p){var r=document.createRange();r.selectNodeContents(p);var s=getSelection();s.removeAllRanges();s.addRange(r);toast("حدّد النص وانسخه",false)}}
document.addEventListener("click",function(e){

  if(d=el.closest("[data-k]")){key(d.dataset.k);return}
  if(d=el.closest("[data-a]")){act(d.dataset.a,d);return}
  if(d=el.closest(".row")){var id=+d.dataset.id;if(selMode){if(SEL[id])delete SEL[id];else SEL[id]=true;render()}else{fromDet=true;detail(id)}return}
  if(el.id==="ov")close();
  else if(el.id==="all"){if(Object.keys(rev).length)rev={};else{rev={total:true};D.types.forEach(function(t){rev["ty:"+t[0]]=true});D.items.forEach(function(i){rev["i:"+i.id]=true})}render()}
  else if(el.id==="un"){if(undo){undo();undo=null}$("ts").style.display="none"}
  else if(el.id==="lsk")$("lk").style.display="none";
  else if(el.id==="lfg")open('<h2>استرجاع الرمز</h2><label>اكتب كود الاسترجاع (8 أرقام)</label><input class="in amt" id="rc" inputmode="numeric" maxlength="8" autocomplete="off"><div class="er" id="rer"></div><button class="go" id="rok">تأكيد</button><button class="go gr" data-a="cn">إلغاء</button>');
  else if(el.id==="rok"){var v=digits($("rc").value).trim();if(D.rec&&hash(v)===D.rec){D.pin=null;D.rec=null;save();close();lock("s1",true)}else $("rer").textContent=D.rec?"الكود غلط":"مفيش كود استرجاع محفوظ"}
});
document.addEventListener("input",function(e){if(e.target.id==="ad")pv()});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&$("ov").style.display==="flex"){if($("ad"))saveAdd();else if($("nm")&&$("nm").value!==undefined&&document.querySelector('[data-a="svitem"]'))saveItem()}});
$("fi").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.items))throw 0;
  window._rs={items:o.items.map(mig),types:(o.types&&o.types.length)?o.types:null};
  open('<h2>هيتم استبدال البنود الحالية. متأكد؟</h2><button class="go red" data-a="yes-rs">نعم، استرجع</button><button class="go gr" data-a="cn">إلغاء</button>')}catch(e){toast("الملف غير صالح",false)}};r.readAsText(f);this.value=""};
document.addEventListener("visibilitychange",function(){if(document.hidden){rev={};render();if(D.pin&&$("lk").style.display!=="flex")lock("unlock",false)}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
if(D.pin)lock("unlock",false);else if(!D.asked){D.asked=true;save();lock("s1",true)}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyDhZq569vl-hnPZaFiQwyCSle9ktELszYM",
    authDomain: "my-money-app-707a4.firebaseapp.com",
    projectId: "my-money-app-707a4",
    storageBucket: "my-money-app-707a4.firebasestorage.app",
    messagingSenderId: "333500825466",
    appId: "1:333500825466:web:3a44fd337134412cbe20c3",
    measurementId: "G-TP65V5M225"
  };

  var badge = $("syncBadge");
  function setBadge(txt, cls){
    if(!badge) return;
    badge.textContent = txt;
    badge.className = "sync" + (cls ? " " + cls : "");
  }

  function updateNetStatus(){
    if(!navigator.onLine) setBadge("📴 أوفلاين (محفوظ)", "off");
    else if(window._fbUser) setBadge("☁ متزامن", "");
  }
  window.addEventListener("online", updateNetStatus);
  window.addEventListener("offline", updateNetStatus);
  updateNetStatus();

  if(typeof firebase === "undefined"){
    setBadge("📴 وضع محلي", "off");
    return;
  }

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  // Enable full offline persistence in IndexedDB
  db.enablePersistence({ synchronizeTabs: true }).catch(function(err){
    console.warn("Persistence notice:", err.code);
  });

  var unsubDoc = null;
  var initialCloudChecked = false;

  window._fbSave = function(){
    if(!window._fbUser) return;
    var ref = db.collection("users").doc(window._fbUser.uid).collection("app").doc("main");
    var payload = {
      items: D.items || [],
      types: D.types || TYD,
      pin: D.pin || null,
      rec: D.rec || null,
      asked: !!D.asked,
      updatedAt: D.updatedAt || Date.now()
    };
    if(navigator.onLine) setBadge("⏳ جاري الحفظ...", "off");
    ref.set(payload).then(function(){
      updateNetStatus();
    }).catch(function(e){
      console.error("Save error:", e);
      if(!navigator.onLine) setBadge("📴 محفوظ أوفلاين", "off");
      else setBadge("⚠ تعذر الرفع", "err");
    });
  };

  window._fbLogout = function(){
    if(unsubDoc){ unsubDoc(); unsubDoc = null; }
    auth.signOut().then(function(){
      window._fbUser = null;
      $("authBox").style.display = "flex";
    });
  };

  // Auth form handler
  $("auBtn").onclick = function(){
    var em = $("auEmail").value.trim();
    var pw = $("auPass").value;
    $("auErr").textContent = "";
    if(!em || !pw){
      $("auErr").textContent = "اكتب الإيميل والباسورد";
      return;
    }
    $("auBtn").disabled = true;
    $("auBtn").textContent = "جاري الدخول...";
    auth.signInWithEmailAndPassword(em, pw).catch(function(err){
      var msg = "تأكد من الإيميل والباسورد";
      if(err.code === "auth/network-request-failed") msg = "تأكد من اتصال الإنترنت لأول تسجيل دخول فقط";
      else if(err.code === "auth/invalid-email") msg = "صيغة الإيميل غير صحيحة";
      else if(err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") msg = "الإيميل أو الباسورد غير صحيح";
      $("auErr").textContent = msg;
    }).finally(function(){
      $("auBtn").disabled = false;
      $("auBtn").textContent = "دخول وتفعيل المزامنة";
    });
  };

  $("auPass").addEventListener("keydown", function(e){
    if(e.key === "Enter") $("auBtn").click();
  });

  auth.onAuthStateChanged(function(user){
    window._fbUser = user;
    if(!user){
      $("authBox").style.display = "flex";
      setBadge("🔒 غير مسجل", "off");
      return;
    }

    $("authBox").style.display = "none";
    updateNetStatus();

    var ref = db.collection("users").doc(user.uid).collection("app").doc("main");
    if(unsubDoc) unsubDoc();
    initialCloudChecked = false;

    unsubDoc = ref.onSnapshot({ includeMetadataChanges: true }, function(snap){
      if(!snap.exists){
        // First time ever on cloud: upload existing local items automatically so nothing is lost!
        if(!initialCloudChecked){
          initialCloudChecked = true;
          window._fbSave();
          if(D.items && D.items.length){
            toast("تم رفع بياناتك القديمة للسحابة بنجاح ☁", false);
          }
        }
        return;
      }

      initialCloudChecked = true;
      var cd = snap.data();
      if(!cd) return;

      // Apply cloud data if it has items or is newer than local
      var cloudTime = cd.updatedAt || 0;
      var localTime = D.updatedAt || 0;
      var hasLocalItems = D.items && D.items.length > 0;
      var hasCloudItems = Array.isArray(cd.items) && cd.items.length > 0;

      if(cloudTime > localTime || (!hasLocalItems && hasCloudItems)){
        D.items = Array.isArray(cd.items) ? cd.items.map(mig) : [];
        if(Array.isArray(cd.types) && cd.types.length) D.types = cd.types;
        if(cd.pin !== undefined) D.pin = cd.pin;
        if(cd.rec !== undefined) D.rec = cd.rec;
        if(cd.asked !== undefined) D.asked = cd.asked;
        D.updatedAt = cloudTime;
        fixTypes();
        save(true);
        render();
        if(D.pin && $("lk").style.display !== "flex" && !window._pinCheckedOnce){
          window._pinCheckedOnce = true;
          lock("unlock", false);
        }
      } else if(hasLocalItems && !hasCloudItems && localTime >= cloudTime){
        window._fbSave();
      }

      if(snap.metadata.fromCache){
        setBadge("📴 محفوظ أوفلاين", "off");
      } else {
        setBadge("☁ متزامن", "");
      }
    }, function(err){
      console.warn("Snapshot error:", err);
      updateNetStatus();
    });
  });
})();
</script>


<script>
(function(){
  try {
    var lk = document.querySelector('link[rel="manifest"]');
    if(lk && lk.href.indexOf("data:") === 0){
      var b64 = lk.href.split(",")[1];
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for(var i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var blob = new Blob([bytes], {type: "application/manifest+json"});
      lk.href = URL.createObjectURL(blob);
    }
  } catch(e){}
})();
</script>
